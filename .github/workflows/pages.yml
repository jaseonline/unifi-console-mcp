# Builds the GitHub Pages site: the Redoc API reference (rendered from the bundled OpenAPI spec) as the home page and at
# /api/, plus docs/ through Jekyll. It runs in the public repo so it renders the
# sanitised spec that sync_public.py publishes, never the private one.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - src/unifi_console_mcp/openapi.yaml
      # The README and docs are the rest of the site, so a change to them must redeploy it too.
      - README.md
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one but never cancels a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Rendered into the source tree before Jekyll runs: an HTML file without front matter is copied as-is, and
      # jekyll-build-pages writes _site as root, so adding files to _site afterwards would fail. A root index.html
      # also stops jekyll-readme-index turning the README into the home page. /api/ keeps the README's existing link.
      - name: Build Redoc API reference
        run: |
          npx --yes @redocly/cli@2.82.0 build-docs src/unifi_console_mcp/openapi.yaml --output index.html
          mkdir -p api && cp index.html api/index.html
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
