  # ================================================================== UNIFI OS: applications, updates, cloud backups
  /proxy/users/api/v2/ucore/controllers:
    get:
      operationId: listConsoleApplications
      summary: Applications on the console (installed, running, version)
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/UsersEnvelope'}
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: {type: string}
                            name: {type: string, examples: [network]}
                            version: {type: string, examples: [11.0.81]}
                            isInstalled: {type: boolean}
                            isConfigured: {type: boolean}
                            isRunning: {type: boolean}
                            installState: {type: string}
                            port: {type: integer}
                            features: {type: object, additionalProperties: {type: boolean}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/users/api/v2/info:
    get:
      operationId: getConsoleInfo
      summary: Console identity, versions and capabilities
      description: |
        Hostname, hardware, UniFi OS build, every application version (`network_version`, `ucore_version`, ...),
        capability lists, start time, remote access and cloud connection state. A cheap first call for "what am I talking to".
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/UsersEnvelope'}
                  - type: object
                    properties:
                      data: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/controllers/checkUpdates:
    post:
      operationId: checkApplicationUpdates
      summary: Ask the console to check for application updates
      description: Triggers a check only; nothing is installed. Read the result from `getFirmwareUpdates` / `listConsoleApplications`.
      tags: [UniFi OS · System]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controllersToCheck]
              properties:
                controllersToCheck: {type: array, items: {type: string, examples: [network]}}
            example: {controllersToCheck: [network]}
      responses:
        '204': {description: 'Check started'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/cloud/backup/settings/list:
    get:
      operationId: listCloudBackups
      summary: Cloud (off-console) backups for this console
      description: |
        Backups stored in the UI cloud, newest first. Pair with `listConsoleBackups` to confirm an off-site copy exists.
        `fileKey` identifies the cloud object; treat it as sensitive.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      parameters:
        - {name: allBackups, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    deviceId: {type: string}
                    hardwareId: {type: string}
                    name: {type: string}
                    backups:
                      type: array
                      items:
                        type: object
                        properties:
                          filename: {type: string}
                          fileKey: {type: string}
                          size: {type: integer}
                          time: {type: integer, description: 'Unix epoch milliseconds'}
                          metadata: {type: object, additionalProperties: true, description: 'As `ConsoleBackup.metadata`, plus `encryption-version`'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

