      description: |
        Same data as *Insights > Flows*. Read-only despite POST. Every filter is an array; an empty array means "any".
        Typical uses: blocked traffic in the last 24 hours (`action: [blocked]`), traffic for one client
        (`source_mac`), or traffic hitting one policy (`policy`). Only policies with `reportFlowEnabled` appear.
        Valid filter values (hosts, IPs, ports, policies) come from `getTrafficFlowFilterData`.
      tags: [Controller · Traffic]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrafficFlowQuery'}
            examples:
              blocked24h:
                summary: Blocked flows in a 24-hour window, first page
                value:
                  action: [blocked]
                  risk: []
                  direction: []
                  protocol: []
                  policy: []
                  source_mac: []
                  destination_port: []
                  timestampFrom: 1792122178094
                  timestampTo: 1792208578094
                  pageNumber: 0
                  pageSize: 100
                  search_text: ''
                  skip_count: false
      responses:
        '200':
          description: One page of flows
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrafficFlowPage'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
