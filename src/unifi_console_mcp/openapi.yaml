        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    delete:
      operationId: deleteFirewallGroup
      summary: Delete a network list (firewall group)
      description: "Returns HTTP 200. Not callable through the generic tool; use `unifi_console_network_list`, which refuses while a policy or traffic object still uses the list."
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/firewallrule:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listLegacyFirewallRules
