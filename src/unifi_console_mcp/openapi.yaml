                   REMOVED_ENTITY, RESUMED_ENTITY, ROGUE_AP_DETECTED, ROGUE_DHCP_SERVER_DETECTED, SFP_EEPROM_ERROR,
                   SFP_RECEIVED_FAULT, SFP_TRANSMISSION_FAULT, SSL_CERTIFICATE_EXPIRY, SSL_INSPECTION_BYPASS,
                   STACKING_LINK_IN_STACK_DISCONNECTED, STACK_CREATED, STACK_EXTENDED, TELEPORT_CLIENT_CONNECTED,
                   TELEPORT_CLIENT_DISCONNECTED, THREAT_BLOCKED, THREAT_DETECTED, VPN_CLIENT_CONNECTED, VPN_CLIENT_DISCONNECTED,
