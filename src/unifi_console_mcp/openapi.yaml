        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/user:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listKnownClients
      summary: Known clients (fixed IPs, names, notes, block state)
      description: Source of truth for fixed-IP records. Changes here must be mirrored in the "Static IPs" sheet.
      tags: [Controller · Clients]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/LegacyEnvelope'}
                  - properties: {data: {type: array, items: {$ref: '#/components/schemas/KnownClient'}}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createKnownClient
      summary: Create a known client (for example a fixed-IP reservation)
      description: Pick an address in `.1`-`.100` of the target subnet (static block); `.101+` is the DHCP pool.
      x-destructive: true
      tags: [Controller · Clients]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnownClientWrite'}
