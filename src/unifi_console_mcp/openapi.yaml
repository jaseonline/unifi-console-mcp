  # ================================================================== CONTROLLER: alerts and logs
  /proxy/network/v2/api/site/{site}/system-log/critical:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: querySystemLog
      summary: Critical System Log entries (the "Critical" tab)
      description: |
        Same data as *System Log > Critical*. Read-only despite POST. No time window or paging; filter by severity,
        category, subcategory and event type. For the full history use `querySystemLogAll`.
        Includes switching problems the device logs rarely surface clearly, for example `NETWORK_LOOP_DETECTED_BY_STP`,
        `LOG_SWITCH_PORT_STP_FLAP`, `BPDU_GUARD_TRIGGERED`, `PORT_BROADCAST_STORM`, `ROGUE_DHCP_SERVER_DETECTED`.
        The UI sends every value; send only the ones of interest to narrow the result.
      tags: [Controller · Alerts]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemLogQuery'}
            examples:
              switchingProblems:
                summary: Loops, STP flaps and storms
                value:
                  searchText: ''
                  severities: [LOW, MEDIUM, HIGH, VERY_HIGH]
                  categories: [UNIFI_DEVICES, UNIFI_ETHERNET_PORTS]
                  subcategories: [SYSTEM_DEVICES, MONITORING_WIRED]
                  events: [NETWORK_LOOP_DETECTED_BY_STP, NETWORK_LOOP_DETECTED_BY_KEEPALIVE, LOG_SWITCH_PORT_STP_FLAP, BPDU_GUARD_TRIGGERED, PORT_BROADCAST_STORM, PORT_MULTICAST_STORM]
                  clientDeviceMacs: []
                  adminIds: []
              security:
                summary: Firewall blocks, IPS and honeypot
                value:
                  searchText: ''
                  severities: [MEDIUM, HIGH, VERY_HIGH]
                  categories: [SECURITY]
                  subcategories: [SECURITY_FIREWALL, SECURITY_INTRUSION_PREVENTION, SECURITY_HONEYPOT]
                  events: [BLOCKED_BY_FIREWALL, THREAT_DETECTED, THREAT_BLOCKED, HONEYPOT_HIT_DETECTED]
                  clientDeviceMacs: []
                  adminIds: []
      responses:
        '200':
          description: Matching critical entries (an empty list when there are none)
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SystemLogEntry'}}
              example:
                - id: 0123456789abcdef01234567
                  timestamp: 1760569347807
                  type: DEVICE_CONNECTION
                  key: DEVICE_UNREACHABLE
                  event: DEVICE_UNREACHABLE
                  category: SYSTEM
                  subcategory: SYSTEM_DEVICES
                  severity: HIGH
                  status: NEW
                  show_on_dashboard: true
                  target: DEVICE
                  title_raw: Device Offline
                  message_raw: '{DEVICE} is offline.'
                  parameters:
                    DEVICE: {id: '00:00:5e:00:53:05', ip: 192.168.1.5, model: US-8, model_name: US8, name: Switch 8, version: 7.2.123}
                    UPLINK: {id: '00:00:5e:00:53:03', name: Switch 16 PoE, port: '9'}
                    LEARN_MORE: {id: LEARN_MORE_ABOUT_DEVICE_OFFLINE, name: Learn more, url: 'https://help.ui.com/hc/en-us/articles/7258465146519'}
                - id: 0123456789abcdef01234568
                  timestamp: 1760513187345
                  type: SWITCH_ISSUE
                  key: NETWORK_LOOP_DETECTED_BY_STP
                  event: NETWORK_LOOP_DETECTED_BY_STP
                  category: SYSTEM
                  subcategory: SYSTEM_NETWORK
                  severity: HIGH
                  status: NEW
                  show_on_dashboard: true
                  target: DEVICE_WITH_PORT
                  title_raw: STP Port Blocked
                  message_raw: '{DEVICE_WITH_PORT} was blocked by STP to prevent a network loop.'
                  parameters:
                    DEVICE_WITH_PORT: {id: '00:00:5e:00:53:03', ip: 192.168.1.3, model: USW-16-PoE, model_name: USL16PB, name: Switch 16 PoE Port 9, version: 7.2.123}
                    PORT: {id: '9', name: '9'}
                    DOWNLINK_MACS: {id: '00:00:5e:00:53:03', list_values: ['00:00:5e:00:53:05']}
                    LEARN_MORE: {id: LEARN_MORE_ABOUT_LOOP, name: Learn more, url: 'https://help.ui.com/hc/en-us/articles/24292724428311'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/system-log/all:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: querySystemLogAll
      summary: System Log history, paged (the "All" tab)
      description: |
        Every System Log entry in a time window, newest first. Read-only despite POST. Volume is dominated by Wi-Fi
        connect, disconnect and roam events (about 2,000 a month on this site), so narrow with `severities`
        (for example `MEDIUM` and above) or `categories` unless client history is the point.
        Entries are templates: replace each `{NAME}` in `title_raw` / `message_raw` with `parameters.NAME.name`.
        For one entry as a syslog line use `getSystemLogEntryCef`.
      tags: [Controller · Alerts]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SystemLogQuery'}
                - type: object
                  required: [timestampFrom, timestampTo, pageNumber, pageSize]
            examples:
              notableLast7Days:
                summary: Medium severity and above, last 7 days
                value:
                  searchText: ''
                  type: GENERAL
                  severities: [MEDIUM, HIGH, VERY_HIGH]
                  categories: [INTERNET_AND_WAN, POWER, SECURITY, UNIFI_DEVICES, UNIFI_ETHERNET_PORTS, VPN]
                  timestampFrom: 1791603778036
                  timestampTo: 1792208578036
                  pageNumber: 0
                  pageSize: 100
                  clientDeviceMacs: []
                  adminIds: []
              oneClient:
                summary: Everything for one client
                value:
                  searchText: ''
                  type: GENERAL
                  severities: [LOW, MEDIUM, HIGH, VERY_HIGH]
                  timestampFrom: 1791603778036
                  timestampTo: 1792208578036
                  pageNumber: 0
                  pageSize: 100
                  clientDeviceMacs: ['00:00:5e:00:53:2e']
                  adminIds: []
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/SystemLogEntry'}}
                  page_number: {type: integer}
                  total_element_count: {type: integer}
                  total_page_count: {type: integer}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/system-log/filter-data:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: getSystemLogFilterData
      summary: Values available to filter the System Log by (for a time window)
      description: Read-only despite POST. Takes the same filters as `querySystemLogAll`, without paging.
      tags: [Controller · Alerts]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
