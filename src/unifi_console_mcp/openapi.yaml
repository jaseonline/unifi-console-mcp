            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/active-leases:
