                      hostId: {type: string}
                      siteId: {type: string}
                      beginTimestamp: {type: string, format: date-time}
                      endTimestamp: {type: string, format: date-time}
            example:
              sites:
                - {hostId: 'EXAMPLEHOSTID:123456789', siteId: 661900ae6aec8f548d49fd54, beginTimestamp: '2026-10-16T00:00:00Z', endTimestamp: '2026-10-17T00:00:00Z'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IspMetricsResponse'}
        '400': {$ref: '#/components/responses/CloudBadRequest'}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
