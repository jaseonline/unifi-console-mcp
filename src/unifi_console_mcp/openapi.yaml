  # ================================================================== CONTROLLER: firewall (UI view)
  /proxy/network/v2/api/site/{site}/firewall-policies:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listFirewallPoliciesWithHits
      summary: Zone-based firewall policies with hit counts (UI view)
      description: |
        The list the UI's *Policy Table* shows, including system-defined policies. Unlike `listFirewallPolicies`
        it returns `hits` and `last_hit`, which make it the right source for audits (unused, shadowed or noisy rules).
        Changes go through the typed tool `unifi_console_firewall_policy` (create, update, enable, disable, delete, move).
      tags: [Controller · Firewall]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FirewallPolicyUi'}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createControllerFirewallPolicy
      summary: Create a zone-based firewall policy
      description: |
        v2 endpoint (captured 2026-10-17). Body: `{name, description, enabled, action (ALLOW|BLOCK|REJECT), create_allow_respond,
        ip_version, logging, report_flow, protocol, connection_state_type, connection_states[], match_ip_sec, schedule{mode},
        source{zone_id, matching_target, ...}, destination{...}}`. HTTP 201 with the whole stored policy including `_id` and
        `index` (the next free index in the zone pair).
        Not callable through the generic tool: use `unifi_console_firewall_policy`, which previews, protects system policies, probes DNS before and after, journals and reads back.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: OK}
        '201': {description: Created}
        '400': {description: Validation failed}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/firewall-policies/batch:
    parameters: [{$ref: '#/components/parameters/Site'}]
    put:
      operationId: batchUpdateFirewallPolicies
      summary: Enable or disable firewall policies (batch)
      description: |
        v2 endpoint (captured 2026-10-17). Body is a list `[{_id, enabled}]`; HTTP 200 with the updated policies.
        Not callable through the generic tool: use `unifi_console_firewall_policy`, which previews, protects system policies, probes DNS before and after, journals and reads back.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {type: object, additionalProperties: true}}
      responses:
        '200': {description: OK}
        '400': {description: Validation failed}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/v2/api/site/{site}/firewall-policies/batch-reorder:
    parameters: [{$ref: '#/components/parameters/Site'}]
    put:
      operationId: reorderFirewallPolicies
      summary: Reorder the custom firewall policies of one zone pair
      description: |
        v2 endpoint (captured 2026-10-17). Body `{before_predefined_ids[], after_predefined_ids[], source_zone_id,
        destination_zone_id}`: the ids of the custom policies that sit before and after the system policies of that zone pair,
        each in the new order. HTTP 200 with the reordered policies and their new indexes.
        Not callable through the generic tool: use `unifi_console_firewall_policy`, which previews, protects system policies, probes DNS before and after, journals and reads back.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {description: OK}
        '400': {description: Validation failed}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/v2/api/site/{site}/firewall-policies/batch-delete:
