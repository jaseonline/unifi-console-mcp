      summary: Neighbouring (rogue) access points seen by your APs
      description: |
        Read-only despite POST. Wi-Fi networks heard by your access points, with signal, channel, band,
        security and which of your APs heard them. With an empty body it returns everything seen (230
        entries, about 90 KB on this site), so pass `_limit` or `within` to narrow. `is_rogue` is the
        controller's own flag; `is_ubnt` marks other Ubiquiti devices. Useful for channel planning.
      tags: ["Controller · Devices"]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                within: {type: integer, description: 'Look-back window in hours', examples: [24]}
                _limit: {type: integer, description: 'Maximum entries', examples: [50]}
            examples:
              last24hTop50: {summary: "Last 24 hours, 50 entries", value: {within: 24, _limit: 50}}
              everything: {summary: Everything seen (large), value: {}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LegacyEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            bssid: {type: string}
                            essid: {type: string}
                            band: {type: string, examples: [ng, na]}
                            channel: {type: integer}
                            bw: {type: integer, description: 'MHz'}
                            security: {type: string}
                            signal: {type: integer, description: 'dBm'}
                            rssi: {type: integer}
                            noise: {type: integer}
                            ap_mac: {type: string, description: 'Your AP that heard it'}
                            radio: {type: string}
                            radio_name: {type: string}
                            oui: {type: string}
                            is_rogue: {type: boolean}
                            is_ubnt: {type: boolean}
                            is_adhoc: {type: boolean}
                            last_seen: {type: integer}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

