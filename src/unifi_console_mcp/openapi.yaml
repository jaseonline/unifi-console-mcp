        destination_ip: {type: array, items: {type: string}}
        destination_port: {type: array, items: {type: integer}}
        destination_network_id: {type: array, items: {type: string}}
        destination_domain: {type: array, items: {type: string}}
        destination_zone_id: {type: array, items: {type: string}}
        destination_region: {type: array, items: {type: string}}
        in_network_id: {type: array, items: {type: string}}
        out_network_id: {type: array, items: {type: string}}
        next_ai_query: {type: array, items: {type: string}}
        except_for: {type: array, items: {type: string}}
        timestampFrom: {type: integer, description: 'Window start (epoch ms)'}
        timestampTo: {type: integer, description: 'Window end (epoch ms)'}
        pageNumber: {type: integer, minimum: 0, description: 'Zero-based'}
