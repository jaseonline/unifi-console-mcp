    put:
      operationId: updateNetworkConfig
      summary: Update a network (whole object)
      description: |
        Captured 2026-10-18: the UI sends the whole object (60 keys) including `_id` and `external_id`. Not callable through the
        generic tool: use `unifi_console_network`.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    delete:
      operationId: deleteNetworkConfig
      summary: Delete a network
      description: "Captured 2026-10-18: no body; reply `{meta:{rc:ok}, data:[]}`. Not callable through the generic tool: use `unifi_console_network`."
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/group/networkconf:
    parameters: [{$ref: '#/components/parameters/Site'}]
    put:
      operationId: updateNetworkConfigGroup
      summary: Change fields on several networks at once (used to enable / disable)
      description: |
        Captured 2026-10-18: body `{"id": ["<network _id>"], "data": {"enabled": false}}`; the reply is a legacy envelope keyed by id,
        each value a nested envelope holding the updated object. Not callable through the generic tool: use `unifi_console_network`.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      requestBody:
        required: true
        content:
