  # ------------------------------------------------------------------ DNS policies
  /proxy/network/integration/v1/sites/{siteId}/dns/policies:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listDnsPolicies
      summary: List local DNS records and forwarders
      description: List items are a summary (type, id, enabled, domain). Filterable on every record field, for example `type`, `domain`, `ipv4Address`, `targetDomain`, `ttlSeconds`.
      tags: [Integration · DNS]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsPolicyPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createDnsPolicy
      summary: Create a DNS record or forwarder
      description: The body shape depends on `type`; pick an example to see each variant.
      x-destructive: true
      tags: [Integration · DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DnsPolicyWrite'}
            examples:
              aRecord:
                summary: A record
                value: {type: A_RECORD, enabled: true, domain: homeassistant.example.home, ipv4Address: 192.168.1.20, ttlSeconds: 14400}
              cname:
                summary: CNAME record
                value: {type: CNAME_RECORD, enabled: true, domain: ha.example.home, targetDomain: homeassistant.example.home, ttlSeconds: 14400}
              mx:
                summary: MX record
                value: {type: MX_RECORD, enabled: true, domain: example.com, mailServerDomain: mail.example.com, priority: 10}
              forward:
                summary: Forward a domain to another resolver
                value: {type: FORWARD_DOMAIN, enabled: true, domain: corp.example, ipAddress: 198.51.100.53}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /proxy/network/integration/v1/sites/{siteId}/dns/policies/{dnsPolicyId}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: dnsPolicyId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getDnsPolicy
      summary: Get a DNS record or forwarder
      tags: [Integration · DNS]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateDnsPolicy
      summary: Update a DNS record or forwarder
      x-destructive: true
      tags: [Integration · DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DnsPolicyWrite'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
