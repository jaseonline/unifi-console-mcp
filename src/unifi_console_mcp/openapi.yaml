  /proxy/network/v2/api/site/{site}/power-supervisors:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listPowerSupervisors
      summary: Automatic power-cycle watchdogs on PoE-powered clients
      description: |
        Each entry watches a client and power-cycles its PoE port after `silence_threshold` missed heartbeats.
        `consecutive_failures` shows whether one has been firing. Check before diagnosing a device that keeps rebooting.
      tags: [Controller · Devices]
