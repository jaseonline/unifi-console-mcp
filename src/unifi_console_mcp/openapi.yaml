  /proxy/network/v2/api/site/{site}/static-dns:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listStaticDns
      summary: Local DNS records on the gateway
      description: |
        Static A, AAAA, CNAME, MX, SRV and TXT records the gateway answers itself (split-horizon names).
        `key` is the record name; `value` is the target. `port`, `priority` and `weight` apply to SRV.
      tags: ["Controller · Networks"]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    _id: {type: string}
                    enabled: {type: boolean}
                    key: {type: string, examples: [host.example.com]}
                    record_type: {type: string, examples: [A, CNAME]}
                    value: {type: string}
                    ttl: {type: integer}
                    port: {type: integer}
                    priority: {type: integer}
                    weight: {type: integer}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createStaticDns
      summary: Create a Local DNS record
      description: |
        v2 endpoint. The UI sends `{record_type, value, key, enabled}` and the console fills in the rest (verified 2026-10-17: HTTP 200).
        Not callable through the generic tool: use `unifi_console_static_dns`, which previews, checks for duplicates and CNAME
        conflicts, journals and reads back.
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaticDnsRecord'}
            examples:
              a: {summary: A record, value: {record_type: A, key: nas.example.home, value: 192.168.1.10, enabled: true}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StaticDnsRecord'}}}}
        '400': {description: Validation failed}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/v2/api/site/{site}/static-dns/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: id, in: path, required: true, description: 'Record `_id` (from `listStaticDns`)', schema: {type: string}}
    put:
      operationId: updateStaticDns
      summary: Update a Local DNS record (whole object)
      description: |
        v2 endpoint: a partial body is **rejected** (HTTP 400, verified 2026-10-17 for `{value}` only and `{enabled}` only), so the
        whole record is sent. Not callable through the generic tool: use `unifi_console_static_dns`.
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaticDnsRecord'}
      responses:
        '200': {description: OK}
        '400': {description: "Validation failed (partial body, bad value)"}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    delete:
      operationId: deleteStaticDns
      summary: Delete a Local DNS record
      description: "Not callable through the generic tool; use `unifi_console_static_dns`."
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      responses:
        '200': {description: OK}
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

