              managementLan:
                summary: Fixed-IP reservation on the management LAN, no local DNS record
                value: {mac: '00:00:5e:00:53:3a', name: Laptop (LAN), use_fixedip: true, local_dns_record_enabled: false, fixed_ip: 192.168.1.60}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/user/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {$ref: '#/components/parameters/ObjectId'}
    put:
      operationId: updateKnownClient
      summary: Update a known client (name, fixed IP, block)
      x-destructive: true
      tags: [Controller · Clients]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnownClientWrite'}
            examples:
              rename: {summary: 'Rename only', value: {name: Kitchen speaker}}
              fullUiBody:
                summary: Body the UI sends when saving a client's settings
                value:
                  name: Games console (WiFi)
                  display_name: Games console (WiFi)
                  local_dns_record_enabled: false
                  local_dns_record: ''
                  virtual_network_override_enabled: false
                  virtual_network_override_id: ''
                  network_members_group_ids: []
                  usergroup_id: ''
                  use_fixedip: true
                  fixed_ip: 10.88.1.61
                  fixed_ap_enabled: false
              clearFixedIp: {summary: 'Remove fixed IP', value: {use_fixedip: false}}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/cmd/stamgr:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: clientManagerCommand
      summary: Client manager command (block, unblock, kick, forget)
      description: Per the project rule, forgetting clients is done only from a reviewed MAC list.
      x-destructive: true
      tags: [Controller · Clients]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd]
              properties:
                cmd:
                  type: string
                  enum: [block-sta, unblock-sta, kick-sta, forget-sta]
                  description: |
                    - `block-sta` / `unblock-sta`: deny or allow network access (uses `mac`)
                    - `kick-sta`: disconnect a wireless client once; it may reconnect (uses `mac`)
                    - `forget-sta`: delete client history (uses `macs`)
                mac: {$ref: '#/components/schemas/MacAddress'}
                macs:
                  type: array
                  description: Used by `forget-sta`
                  items: {$ref: '#/components/schemas/MacAddress'}
            examples:
              kick: {summary: 'Kick a wireless client', value: {cmd: kick-sta, mac: '00:00:5e:00:53:01'}}
              block: {summary: 'Block a client', value: {cmd: block-sta, mac: '00:00:5e:00:53:01'}}
              unblock: {summary: 'Unblock a client', value: {cmd: unblock-sta, mac: '00:00:5e:00:53:01'}}
              forget: {summary: 'Forget reviewed clients', value: {cmd: forget-sta, macs: ['00:00:5e:00:53:01', '00:00:5e:00:53:02']}}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/clients/active:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listActiveClients
      summary: Active clients with traffic usage
      tags: [Controller · Clients]
      security: [{ControllerSession: []}]
      parameters:
        - {name: includeTrafficUsage, in: query, schema: {type: boolean, default: false}}
        - {name: includeUnifiDevices, in: query, description: 'Include UniFi devices that appear as clients', schema: {type: boolean, default: false}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActiveClient'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/clients/history:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listClientHistory
      summary: Historic clients (use to find stale or blocked clients)
      description: |
        To build a forget list of stale clients, call with `onlyNonBlocked=true&includeUnifiDevices=false&withinHours=0`,
        then keep entries with `status` = `offline` and `use_fixedip` = `false` (fixed-IP reservations are kept).
      tags: [Controller · Clients]
      security: [{ControllerSession: []}]
      parameters:
        - {name: onlyBlocked, in: query, description: 'Return blocked clients only', schema: {type: boolean, default: false}}
        - {name: onlyNonBlocked, in: query, description: 'Exclude blocked clients', schema: {type: boolean, default: false}}
        - {name: includeUnifiDevices, in: query, description: 'Include UniFi devices that appear as clients', schema: {type: boolean, default: false}}
        - {name: withinHours, in: query, description: '0 = all', schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ActiveClient'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/api/s/{site}/rest/networkconf:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listNetworkConfig
      summary: Network configuration (VLANs, DHCP, IGMP, mDNS, zone assignment)
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/LegacyEnvelope'}
                  - properties: {data: {type: array, items: {$ref: '#/components/schemas/LegacyNetworkConf'}}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createNetworkConfig
      summary: Create a network / VLAN (controller format)
      description: |
        Captured 2026-10-18 (UI create of a throwaway VLAN): a whole object of 53 keys without `_id`, naming `firewall_zone_id`;
        the reply is the legacy envelope with `_id`, `external_id`, `site_id`, `mdns_enabled`, `dpi_enabled` and the `dhcpdv6_*` keys added.
        Not callable through the generic tool: use `unifi_console_network`.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/networkconf/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
