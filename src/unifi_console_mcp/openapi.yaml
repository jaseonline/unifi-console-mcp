              schema:
                allOf:
                  - {$ref: '#/components/schemas/UsersEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ConsoleUser'}
              example:
                code: 0
                codeS: SUCCESS
                msg: ''
                data:
                  unique_id: 2b6f1c3e-4d5a-4e6b-8c7d-9e0f1a2b3c4d
                  username: svc-claude-mcp
                  full_name: Claude MCP
                  status: ACTIVE
