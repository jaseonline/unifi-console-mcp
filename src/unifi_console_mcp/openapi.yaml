        clientDeviceMacs: {type: array, items: {type: string}, description: 'Limit to these clients'}
        adminIds: {type: array, items: {type: string}, description: 'Limit to actions by these admins'}
    DeviceSettingsWrite:
      type: object
      description: Device settings as saved by the UI. Switch-only fields are ignored on other device types.
      properties:
        name: {type: string}
        led_override: {type: string, enum: ['on', 'off', default], description: '`default` follows the site LED setting'}
        led_override_color: {type: string, description: 'Hex colour (devices with RGB LEDs)', examples: ['#0000ff']}
        led_override_color_brightness: {type: integer, minimum: 0, maximum: 100}
        config_network:
          type: object
          description: Management IP. **Changing this can strand the device.**
          properties:
            type: {type: string, enum: [dhcp, static]}
            ip: {type: string, format: ipv4}
            netmask: {type: string, format: ipv4}
            gateway: {type: string, format: ipv4}
            dns1: {type: string}
            dns2: {type: string}
            dnssuffix: {type: string}
            bonding_enabled: {type: boolean}
        mgmt_network_id: {type: string, description: 'Network the device is managed on'}
        snmp_contact: {type: string}
        snmp_location: {type: string}
        jumboframe_enabled: {type: boolean, description: 'Switches'}
        flowctrl_enabled: {type: boolean, description: 'Switches'}
        stp_version: {type: string, examples: [stp, rstp], description: 'Switches. **Topology-affecting.**'}
        stp_priority: {type: string, description: 'Switches; a multiple of 4096 as a string. Lower wins root election. **Topology-affecting.**', examples: ['8192', '32768']}
        dot1x_portctrl_enabled: {type: boolean, description: 'Switches'}
        ether_lighting: {type: object, additionalProperties: true, description: 'Etherlighting switches only'}
        port_overrides:
          type: array
          description: Switches. Replaces every saved port setting; see the operation description.
          items: {$ref: '#/components/schemas/PortOverride'}
        hardware_offload: {type: boolean, description: 'Gateways'}
        nat_mode: {type: string, examples: [auto], description: 'Gateways'}
        nat_excluded_network_ids: {type: array, items: {type: string}, description: 'Gateways'}
        firewall_state_timeouts: {$ref: '#/components/schemas/FirewallStateTimeouts'}
        firewall_connection_tracking_modules: {type: array, items: {type: string}, description: 'Gateways'}
        ikev2_seamless_rekeying: {type: boolean, description: 'Gateways'}
    StatsSeries:
      type: object
      properties:
        siteId: {type: string}
        deviceMac: {$ref: '#/components/schemas/MacAddress'}
        unitId: {type: [integer, 'null'], description: 'Stack unit; null when not stacked'}
        series:
          type: array
          items:
            type: object
            properties:
              timestamp: {type: integer, description: 'Bucket start (epoch ms)'}
              duration: {type: integer, description: 'Bucket length in ms (shorter for the last, partial bucket)'}
              avgCpuUtilizationPct: {type: number, description: '`systemBySiteByDevice`'}
              avgMemoryUtilizationPct: {type: number, description: '`systemBySiteByDevice`'}
              byPort:
                type: array
                items:
                  type: object
                  properties:
                    portIdx: {type: integer}
                    rxBytes: {type: number}
                    txBytes: {type: number}
                    rxPackets: {type: number}
                    txPackets: {type: number}
                    rxBcastPackets: {type: number}
                    txBcastPackets: {type: number}
                    rxMcastPackets: {type: number}
                    txMcastPackets: {type: number}
                    rxErrorPackets: {type: number, description: 'CRC and other receive errors; any steady count suggests a cable or optic fault'}
                    txErrorPackets: {type: number}
                    rxDroppedPackets: {type: number}
                    txDroppedPackets: {type: number}
                    avgPoePowerW: {type: number, description: 'PoE ports only'}
                    maxPoePowerW: {type: number, description: 'PoE ports only'}
    PortOverride:
      type: object
      description: Saved settings for one switch port, as held in a device's `port_overrides`.
      required: [port_idx]
      properties:
        port_idx: {type: integer}
        name: {type: string}
        setting_preference: {type: string, enum: [auto, manual]}
        forward:
          type: string
          enum: [all, customize, disabled]
          description: '`all` = native network plus every VLAN tagged; `customize` = native plus `excluded_networkconf_ids` removed; `disabled` = port off.'
        native_networkconf_id: {type: string, description: 'Untagged network (`_id` from `listNetworksLegacy` / `networkconf`). Empty when disabled. **Changing it moves the device to another VLAN.**'}
        excluded_networkconf_ids: {type: array, items: {type: string}, description: 'Tagged networks blocked on this port (with `forward` = `customize`)'}
        tagged_vlan_mgmt: {type: string, enum: [auto, block_all, custom]}
        voice_networkconf_id: {type: string}
        poe_mode: {type: string, examples: [auto, 'off', pasv24, passthrough]}
        autoneg: {type: boolean}
        speed: {type: integer, description: 'Mbps, when `autoneg` is false'}
        full_duplex: {type: boolean}
        flow_control_enabled: {type: boolean}
        isolation: {type: boolean}
        link_debounce_auto: {type: boolean}
        port_keepalive_enabled: {type: boolean}
        egress_rate_limit_kbps_enabled: {type: boolean}
        egress_rate_limit_kbps: {type: integer}
        port_security_enabled: {type: boolean}
        port_security_mac_address: {type: array, items: {$ref: '#/components/schemas/MacAddress'}}
        lldpmed_enabled: {type: boolean}
        dot1x_ctrl: {type: string, examples: [force_authorized, auto, mac_based, multi_host]}
        dot1x_idle_timeout: {type: integer}
        multicast_router_mode: {type: string, examples: [NONE]}
        multicast_router_networkconf_ids: {type: array, items: {type: string}}
        sd_wan_underlay_port: {type: boolean}
        stormctrl_type: {type: string, examples: [rate]}
        stormctrl_bcast_enabled: {type: boolean}
        stormctrl_bcast_rate: {type: integer, description: 'Packets per second'}
        stormctrl_mcast_enabled: {type: boolean}
        stormctrl_mcast_rate: {type: integer}
        stormctrl_ucast_enabled: {type: boolean}
        stormctrl_ucast_rate: {type: integer}
        stp_port_mode: {type: boolean, description: 'STP enabled on the port. **Topology-affecting.**'}
        stp_edge_state: {type: string, enum: [auto, enabled, disabled], description: 'Edge (PortFast) port'}
        stp_bpdu_guard_enabled: {type: boolean, description: 'Shut the port if it receives a BPDU (another switch plugged in)'}
        stp_uplink: {type: boolean}
    FirewallStateTimeouts:
      type: object
      description: Gateway connection-tracking timeouts (seconds).
      properties:
        timeout_setting_preference: {type: string, enum: [auto, manual]}
        tcp_established_timeout: {type: integer}
        tcp_close_timeout: {type: integer}
        tcp_close_wait_timeout: {type: integer}
        tcp_fin_wait_timeout: {type: integer}
        tcp_last_ack_timeout: {type: integer}
        tcp_syn_recv_timeout: {type: integer}
        tcp_syn_sent_timeout: {type: integer}
        tcp_time_wait_timeout: {type: integer}
        udp_stream_timeout: {type: integer}
        udp_other_timeout: {type: integer}
        icmp_timeout: {type: integer}
        other_timeout: {type: integer}
        unbind_wan_monitors: {type: boolean}
        dns_verification:
          type: object
          properties:
            setting_preference: {type: string, enum: [auto, manual]}
            domain: {type: string}
            primary_dns_server: {type: string}
            secondary_dns_server: {type: string}
    SystemLogEntry:
      type: object
      description: |
        One System Log entry. `title_raw` and `message_raw` are templates: each `{NAME}` is replaced by
        `parameters.NAME.name`. `target` names the parameter the entry is about (for example `CLIENT`, `WAN_ID`, `DEVICE`).
      properties:
        id: {type: string, description: 'UUID for `system-log/all` entries, 24-hex for critical entries. Pass to `getSystemLogEntryCef`.', examples: [7c1e5f2b-3d8a-4e6c-9f1b-2d0a4e3f5a6b, 0123456789abcdef01234567]}
        timestamp: {type: integer, description: 'Epoch ms'}
        type: {type: string, examples: [CLIENT_CONNECTION, ISP, DEVICE_CONNECTION, SWITCH_ISSUE]}
        key: {type: string, description: 'Template key (event plus version suffix)', examples: [ISP_HIGH_LATENCY_2]}
        event: {type: string, description: 'One of the `SystemLogQuery.events` values', examples: [ISP_HIGH_LATENCY]}
        category: {type: string, description: 'Not always a filter category: critical device and switch entries use `SYSTEM`.', examples: [INTERNET_AND_WAN, CLIENT_DEVICES, SYSTEM]}
        subcategory: {type: string, examples: [INTERNET_PERFORMANCE]}
        severity: {type: string, enum: [LOW, MEDIUM, HIGH, VERY_HIGH]}
        status: {type: string, examples: [NEW]}
        show_on_dashboard: {type: boolean}
        target: {type: string}
        title_raw: {type: string, examples: ['{WAN_ID} High Latency Detected']}
        message_raw: {type: string, examples: ['Internet connection {WAN_ID} {ISP_NAME} on port {PORT} is experiencing high latency.']}
        parameters:
          type: object
          description: Values for the template placeholders. Common keys are CLIENT, DEVICE, NETWORK, WLAN, WAN_ID, ISP_NAME, LATENCY.
          additionalProperties: {$ref: '#/components/schemas/SystemLogParameter'}
      example:
        id: 7c1e5f2b-3d8a-4e6c-9f1b-2d0a4e3f5a6b
        timestamp: 1792083291931
        type: ISP
        key: ISP_HIGH_LATENCY_2
        event: ISP_HIGH_LATENCY
        category: INTERNET_AND_WAN
        subcategory: INTERNET_PERFORMANCE
        severity: MEDIUM
        status: NEW
        show_on_dashboard: false
        target: WAN_ID
        title_raw: '{WAN_ID} High Latency Detected'
        message_raw: 'Internet connection {WAN_ID} {ISP_NAME} on port {PORT} is experiencing high latency.'
        parameters:
          WAN_ID: {id: WAN, name: WAN1, not_actionable: true}
          ISP_NAME: {name: Example ISP, enclosed_with_brackets: true, not_actionable: true}
          PORT: {id: '2', name: '2', not_actionable: true}
          LATENCY: {name: '34'}
          WAN_SLA_SERVER: {name: 1.1.1.1}
          DEVICE: {id: '00:00:5e:00:53:01', ip: 192.168.1.1, model: Gateway Lite, model_name: UXG, name: Gateway, version: 5.1.26}
    SystemLogParameter:
      type: object
      description: A placeholder value. `name` is the display text; the other fields vary by parameter type.
      additionalProperties: true
      properties:
        name: {type: string}
        id: {type: string, description: 'MAC for devices and clients, ID or key otherwise'}
        ip: {type: string}
        model: {type: string}
        model_name: {type: string}
        version: {type: string}
        hostname: {type: string}
        subnet: {type: string}
        vlan_id: {type: integer}
        network_purpose: {type: string}
        port: {type: string, description: 'Switch port (for example on `UPLINK`)'}
        url: {type: string, format: uri, description: 'Help article (on `LEARN_MORE`)'}
        list_values: {type: array, items: {type: string}, description: 'Multi-value parameters, for example `DOWNLINK_MACS`'}
        device_fingerprint_id: {type: integer}
        fingerprint_source: {type: integer}
        not_actionable: {type: boolean, description: 'Display-only (not a link in the UI)'}
        enclosed_with_brackets: {type: boolean}
    AlarmRule:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        trigger_categories: {type: array, items: {type: object, additionalProperties: true}}
        action_categories: {type: array, items: {type: object, additionalProperties: true}}
        scope:
          type: object
          properties:
            mode: {type: string}
            data: {type: object, additionalProperties: true}
        stats: {type: object, properties: {executions_24h: {type: integer}}}
        author: {type: object, properties: {id: {type: string}, name: {type: string}}}
        created_at: {type: string, format: date-time}
    FirewallPolicyUi:
      type: object
      description: Controller (UI) view of a zone-based firewall policy. Field names differ from the Integration API.
      properties:
        _id: {type: string}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        index: {type: integer, description: 'Evaluation order within the zone pair'}
        action: {type: string, examples: [ALLOW, BLOCK, REJECT]}
        predefined: {type: boolean, description: 'System-defined policy'}
        origin_type: {type: [string, 'null'], examples: [custom_firewall_rule]}
        origin_id: {type: string}
        ip_version: {type: string, examples: [BOTH, IPV4, IPV6]}
        protocol: {type: string, examples: [all, tcp, udp, tcp_udp, icmp, icmpv6, igmp]}
        match_opposite_protocol: {type: boolean}
        icmp_typename: {type: string}
        icmp_v6_typename: {type: string}
        connection_state_type: {type: string, examples: [ALL, RESPOND_ONLY, CUSTOM]}
        connection_states: {type: array, items: {type: string}}
        create_allow_respond: {type: boolean, description: 'Auto-allow return traffic'}
        match_ip_sec: {type: boolean}
        logging: {type: boolean}
        report_flow: {type: boolean}
        schedule: {type: object, additionalProperties: true, properties: {mode: {type: string, examples: [ALWAYS]}}}
        hits: {type: integer, description: 'Match counter reported by the gateway; 0 suggests an unused policy'}
        last_hit: {type: [integer, 'null'], description: 'Timestamp of the last match; null if never matched'}
        source: {$ref: '#/components/schemas/FirewallPolicyUiEndpoint'}
        destination: {$ref: '#/components/schemas/FirewallPolicyUiEndpoint'}
    FirewallPolicyUiEndpoint:
      type: object
      properties:
        zone_id: {type: string}
        matching_target: {type: string, examples: [ANY, NETWORK, IP, CLIENT, IID]}
        matching_target_type: {type: string}
        network_ids: {type: array, items: {type: string}}
        ips: {type: array, items: {type: string}}
        client_macs: {type: array, items: {type: string}}
        iid: {type: string}
        match_mac: {type: boolean}
        match_opposite_networks: {type: boolean}
        match_opposite_ips: {type: boolean}
        match_opposite_iid: {type: boolean}
        port_matching_type: {type: string, examples: [ANY, SPECIFIC]}
        port: {type: string}
        match_opposite_ports: {type: boolean}
    EnrichedConfiguration:
      type: object
      properties:
        configuration: {type: object, additionalProperties: true, description: 'The underlying networkconf / wlanconf record'}
        details: {type: object, additionalProperties: true, description: 'For WANs, `service_provider`'}
        statistics:
          type: object
          additionalProperties: true
          properties:
            current_client_count: {type: integer}
            peak_client_count: {type: integer}
            current_access_point_count: {type: integer}
            current_satisfaction: {type: integer, minimum: 0, maximum: 100}
            uptime_percentage: {type: number, description: 'WAN only'}
            peak_usage: {type: object, additionalProperties: true, description: 'WAN only'}

    # ================================================================ UniFi OS: users and roles
    UsersEnvelope:
      type: object
      description: Envelope used by `/proxy/users/api/v2/*`. `code` 0 / `codeS` `SUCCESS` on success.
      properties:
        code: {type: integer, examples: [0]}
        codeS: {type: string, examples: [SUCCESS]}
        msg: {type: string}
    ConsoleRole:
      type: object
      properties:
        unique_id: {type: string, format: uuid}
        name: {type: string, examples: [Owner, Super Admin, Network read-only]}
        system_role: {type: boolean}
        system_key: {type: string, examples: [owner]}
        level: {type: integer, description: 'Role level (Owner is 1)'}
        is_private: {type: boolean}
        create_time: {type: string}
        update_time: {type: string}
    ConsoleUser:
      type: object
      description: Console (UniFi OS) user. Personal fields omitted here; the API also returns e-mail, phone, avatar and SSO details.
      properties:
        unique_id: {type: string, format: uuid}
        username: {type: string}
        full_name: {type: string}
        status: {type: string, examples: [ACTIVE]}
        only_local_account: {type: boolean, description: 'True for a local account with no UI (cloud) login - best for integrations'}
        only_ui_account: {type: boolean}
        create_time: {type: integer}
        login_time: {type: integer, description: 'Last login (epoch seconds)'}
        last_activity_time: {type: integer}
        roles: {type: array, items: {$ref: '#/components/schemas/ConsoleRole'}}
        permissions:
          type: object
          description: Effective permission levels per area, for example `network.management`, `system.management.user`.
          additionalProperties: {type: array, items: {type: string, examples: [admin, readonly]}}
        api_keys: {type: array, items: {type: object, additionalProperties: true}}

    # ================================================================ Cloud (Site Manager)
    CloudEnvelope:
      type: object
      required: [httpStatusCode]
      properties:
        httpStatusCode: {type: integer, examples: [200]}
        traceId: {type: string, description: 'Quote this when contacting Ubiquiti support'}
    CloudError:
      allOf:
        - {$ref: '#/components/schemas/CloudEnvelope'}
        - properties:
            code: {type: string}
            message: {type: string}
    CloudHost:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, examples: ['EXAMPLEHOSTID:123456789']}
        hardwareId: {type: string, format: uuid}
        type: {type: string, examples: [console, network-server]}
        ipAddress: {type: string, examples: [203.0.113.10]}
        owner: {type: boolean}
        isBlocked: {type: boolean}
        registrationTime: {type: string, format: date-time}
        lastConnectionStateChange: {type: string, format: date-time}
        latestBackupTime: {type: string, format: date-time}
        reportedState:
          type: object
          additionalProperties: true
          description: Live state reported by the console (name, firmware, controllers, WAN, location...).
          properties:
            hostname: {type: string}
            name: {type: string, examples: [CloudKey-Gen2-Plus]}
            version: {type: string, description: 'UniFi OS version'}
            state: {type: string, examples: [connected]}
            controllers: {type: array, items: {type: object, additionalProperties: true}}
        userData: {type: object, additionalProperties: true}
    CloudSite:
      type: object
      additionalProperties: true
      properties:
        siteId: {type: string}
        hostId: {type: string}
        meta:
          type: object
          additionalProperties: true
          properties:
            name: {type: string, examples: [default]}
            desc: {type: string, examples: [Default]}
            timezone: {type: string, examples: [Europe/London]}
            gatewayMac: {$ref: '#/components/schemas/MacAddress'}
        statistics:
          type: object
          additionalProperties: true
          description: Device and client counts, ISP info, WAN uptime percentage.
        permission: {type: string, enum: [owner, admin, super-admin, read-only]}
        isOwner: {type: boolean}
    CloudDevice:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        mac: {type: string}
        name: {type: string}
        model: {type: string}
        shortname: {type: string, examples: [USL8LP]}
        ip: {type: string}
        productLine: {type: string, examples: [network, protect]}
        status: {type: string, examples: [online, offline]}
        version: {type: string}
        firmwareStatus: {type: string, examples: [upToDate, updateAvailable]}
        updateAvailable: {type: [string, 'null']}
        isConsole: {type: boolean}
        isManaged: {type: boolean}
        adoptionTime: {type: [string, 'null'], format: date-time}
        startupTime: {type: string, format: date-time}
        note: {type: [string, 'null']}
        uidb: {type: object, additionalProperties: true, description: 'Product image references'}
    IspMetricsResponse:
      allOf:
        - {$ref: '#/components/schemas/CloudEnvelope'}
        - properties:
            data:
              type: array
              items:
                type: object
                properties:
                  metricType: {type: string, enum: [5m, 1h]}
                  hostId: {type: string}
                  siteId: {type: string}
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        metricTime: {type: string, format: date-time}
                        version: {type: string}
                        data:
                          type: object
                          properties:
                            wan:
                              type: object
                              additionalProperties: true
                              properties:
                                avgLatency: {type: number, description: 'ms'}
                                maxLatency: {type: number, description: 'ms'}
                                packetLoss: {type: number, description: 'Percent'}
                                uptime: {type: number, description: 'Percent of the period'}
                                downtime: {type: number}
                                download_kbps: {type: number}
                                upload_kbps: {type: number}
                                ispName: {type: string}
                                ispAsn: {type: string}
    SdwanConfig:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string}
        variant: {type: string, examples: [hub-spoke, mesh]}
        settings: {type: object, additionalProperties: true}
