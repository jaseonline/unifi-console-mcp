                   NETWORK_FAILED_OVER_TO_BACKUP_WAN, NETWORK_FAILED_OVER_TO_BACKUP_WAN_TEMPORARY, NETWORK_LOOP_DETECTED_BY_KEEPALIVE,
                   NETWORK_LOOP_DETECTED_BY_STP, NETWORK_UPDATED, NETWORK_WAN_FAILED, NETWORK_WAN_FAILED_MULTIPLE_TIMES,
                   NETWORK_WAN_FAILED_TEMPORARY, NETWORK_WAN_LOAD_BALANCING_DEGRADED, NETWORK_WAN_RESTORED,
                   NEW_WIFI_CLIENT_CONNECTED, NEW_WIRED_CLIENT_CONNECTED, PAUSED_ENTITY, POE_BUDGET_EXCEEDED,
                   POE_PORT_BUDGET_EXCEEDED, POLICY_BASED_ROUTING_STARTED, POLICY_BASED_ROUTING_STOPPED, PORT_BROADCAST_STORM,
                   PORT_DHCP_STORM, PORT_DOS, PORT_DROPPED_TRAFFIC, PORT_LOCK_VIOLATION, PORT_MAC_LOCKING, PORT_MULTICAST_STORM,
