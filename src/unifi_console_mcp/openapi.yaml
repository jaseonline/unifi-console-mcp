        The zone-based UI calls these "lists" (Network Settings). The UI sends `{_id: null, name, description, group_type,
        group_members, source: "static"}`; `group_type` is `port-group`, `address-group` or `domain-group`. Not callable
        through the generic tool: use `unifi_console_network_list`.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallGroup'}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/firewallgroup/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {$ref: '#/components/parameters/ObjectId'}
    put:
      operationId: updateFirewallGroup
      summary: Update a network list (firewall group)
      description: |
        Legacy `rest/*` endpoint: a **partial body is merged** (verified 2026-10-17: `{description}` alone changed only the
        description), but `group_members` is always replaced whole. Not callable through the generic tool: use
        `unifi_console_network_list`, which previews, checks what uses the list, journals and reads back.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
