      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  # ================================================================== UNIFI OS (console root)
  /api/system/syslog/settings:
    get:
      operationId: getSyslogSettings
      summary: Console syslog settings (Insights Plus feed)
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200': {description: 'OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/firmware/update:
    get:
      operationId: getFirmwareUpdates
      summary: Console firmware update status
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200': {description: 'OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/userCertificates:
    get:
      operationId: listUserCertificates
      summary: List custom TLS certificates (expiry, issuer, renewal status)
      description: |
        Certificates installed under *Settings > Control Plane > Console > Certificates*, including Let's Encrypt
        certificates the console renews itself. Metadata only (no certificate or key material).
        To check expiry, read `valid_to`; `acme_renew_error` is non-null when the last automatic renewal failed.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/UserCertificate'}}
              example:
                - id: 6b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                  name: '*.example.home'
                  version: 3
                  serial_number: 0123456789ABCDEF0123456789ABCDEF0123
                  fingerprint: 00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33
                  subject: {CN: '*.example.home'}
                  issuer: {C: US, O: "Let's Encrypt", CN: YR1}
                  subject_alt_name: {DNS: ['*.example.home']}
                  valid_from: '2026-10-07T22:26:19.000Z'
                  valid_to: '2027-01-05T22:26:18.000Z'
                  created_at: '2026-10-07T23:24:50.753Z'
                  updated_at: '2026-10-07T23:24:50.753Z'
                  source: lets_encrypt
                  acme_renew_error: null
                  active: true
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/userCertificates/challenge/current:
    get:
      operationId: getCertificateChallenge
      summary: Current ACME (Let's Encrypt) challenge
      description: Returns `{}` when no certificate request or renewal is in progress. The in-progress shape has not been captured.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
              example: {}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api-docs/integration.json:
    get:
      operationId: getIntegrationOpenApi
      summary: Download the Integration API's own OpenAPI document
      description: |
        The machine-readable spec behind *Settings > Control Plane > Integrations > API docs*, for the running Network
        version. Its `servers` entry is the relative `/integration`, so prefix `/proxy/network` when calling from outside.
        Use it to check this spec after a Network application upgrade.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/support/file/generate:
    post:
      operationId: generateSupportFile
      summary: Generate a support file (diagnostic bundle)
      description: |
        Same as *Settings > Control Plane > Console > Support File* in the console UI. Takes about a minute; fetch the result
        with `downloadSupportFile`. Omit `targets` for a combined console + Network bundle.
        Far more complete than the log endpoints: for `network` it contains the Network
        application logs (`server.log`, `access.log`, `tasks.log`, `mongod.log`, migration and backup logs), remote syslog
        from every adopted device (`logs/remote2/`), each device's last inform and `system.cfg`, topology, crash log,
        thread dump, admin change log and version history. Use it when the regular logs do not show the cause
        (for example an STP issue visible only in device syslog).

        **Sensitive:** device `system.cfg` files contain Wi-Fi passphrases, device SSH passwords and VPN/RADIUS secrets
        in plain text. Never keep the bundle inside a git working tree; store it in a password manager or encrypted storage.
      tags: [UniFi OS · System]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: |
                    Parts to include. Omit for everything.
                    - `network`: Network application and adopted devices
                    - `uos`: the console itself (UniFi OS on the Cloud Key)
                  items: {type: string, enum: [network, uos]}
                recreate: {type: boolean, default: false, description: 'Build a fresh bundle instead of reusing a recent one'}
                requiredDevices:
                  type: object
                  additionalProperties: true
                  description: Devices to collect extra data from; `{}` (none) is what the UI sends by default.
            examples:
              network:
                summary: Network application only
                value: {recreate: false, requiredDevices: {}, targets: [network]}
              console:
                summary: Console (Cloud Key) only
                value: {recreate: false, requiredDevices: {}, targets: [uos]}
              everythingFresh:
                summary: Console and Network, freshly built
                value: {recreate: true}
      responses:
        '200': {description: 'Support file generated (response body not captured)'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
        '403': {description: 'Missing or stale `X-CSRF-Token`'}
  /api/support/file/download:
    get:
      operationId: downloadSupportFile
      summary: Download the generated support file
      description: |
        Returns the bundle made by `generateSupportFile` as a gzipped tar, named `support-<last 4 hex of console MAC>-<epoch ms>.tgz`.
        Contains secrets in plain text; see `generateSupportFile`.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: Support bundle
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/backup/now:
    post:
      operationId: createConsoleBackup
      summary: Create a console (UniFi OS) backup now
      description: |
        Same as *Settings > Control Plane > Backups > Create Backup* in the console UI. Covers the whole console,
        not just the Network application. Sent with an empty body (`Content-Length: 0`).
        Returns no body; the new entry appears at the top of `listConsoleBackups` with the schedule's `frequency`
        (for example `WEEKLY`), not a separate manual label.
      tags: [UniFi OS · System]
      security: [{ControllerSession: [], CsrfToken: []}]
      parameters:
        - name: destination
          in: query
          required: true
          description: Where to store the backup. Only `local` (on the console) has been observed.
          schema: {type: string, examples: [local]}
      responses:
        '204': {description: 'Backup created'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
        '403': {description: 'Missing or stale `X-CSRF-Token`'}
  /api/backup/local/list:
    get:
      operationId: listConsoleBackups
      summary: List console (UniFi OS) backups stored on the console
      description: Newest first. Each entry records the console firmware and the version of every application and service it covers.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ConsoleBackup'}}
              example:
                - id: 3f2b6c1e-8a4d-4e7f-9b0c-1d2e3f4a5b6c
                  time: 1792205209266
                  frequency: WEEKLY
                  size: 1055377
                  metadata:
                    controllers: {network: {size: 520, version: 11.0.81-37038-1, success: true}}
                    services: {users: {size: 548, version: 1.14.7+19, success: true}}
                    firmware_version: 6.0.11
                    hardware_shortname: UCKP
                    id: 3f2b6c1e-8a4d-4e7f-9b0c-1d2e3f4a5b6c
                    mac: 00005E005301
                    owner_id: 9c8b7a6f-5e4d-4c3b-2a1f-0e9d8c7b6a5f
                    timezone: Europe/London
                    created_at: 1792205209266
                    frequency: WEEKLY
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/backup/download:
    get:
      operationId: downloadBackup
      summary: Download a console backup
      description: |
        Builds and returns a fresh archive at request time (the file name's timestamp and ID do not match any entry in
        `listConsoleBackups`). Without `target` it is *Backup for All Applications and Settings*.
        Treat the file as sensitive (contains configuration and credentials). Store it in a password manager or encrypted storage only.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      parameters:
        - name: target
          in: query
          required: false
          description: |
            Limit the archive to one part. Omit for everything.
            - `uos`: UniFi OS settings
            - `network`: Network application
            - `users`: users and permissions
          schema: {type: string, enum: [uos, network, users]}
      responses:
        '200':
          description: Backup archive
          headers:
            Filename:
              description: |
                Archive file name (sent instead of `Content-Disposition`). The pattern depends on `target`:
                - none: `unifi_os_backup_<epoch ms>_<uuid>.unifi`
                - `uos`: `unifi_os_backup_for_uos_<epoch ms>_<8 hex>.unifi`
                - `users`: `unifi_os_backup_for_users_<epoch ms>_<8 hex>.unifi`
                - `network`: `network_backup_<MM.DD.YYYY>_<hh-mm-AM|PM>_v<Network version>.unf`, the same `.unf` format
                  as a Network application backup (restorable through the Network app)
              schema:
                type: string
                examples:
                  - unifi_os_backup_1792206701678_3f2b6c1e-8a4d-4e7f-9b0c-1d2e3f4a5b6c.unifi
                  - unifi_os_backup_for_uos_1792206755073_1a2b3c4d.unifi
                  - network_backup_10.17.2026_03-12-AM_v11.0.81.unf
                  - unifi_os_backup_for_users_1792206778878_5e6f7a8b.unifi
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  # ================================================================== CONTROLLER: traffic and Insights (from UI captures, 11.0.81)
  /proxy/network/v2/api/site/{site}/traffic-flows:
