  # ================================================================== CONTROLLER: configuration
  /proxy/network/api/s/{site}/get/setting:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listSiteSettings
      summary: All site settings (one record per `key`)
      description: |
        Every site-level setting group in one call: for example `mgmt` (device SSH), `ips`, `dpi`, `ntp`, `snmp`,
        `rsyslogd`, `radius`, `teleport`, `ssl_inspection`, `doh`, `netflow`, `country`, `connectivity`, `guest_access`,
        `super_mgmt`, `super_smtp` (47 keys on 11.0.81). Read one group with `getSiteSetting`.

        **Sensitive:** fields prefixed `x_` hold secrets in plain text (device SSH password, RADIUS and SMTP secrets,
        SNMP community, element PSK). Never log or store the raw response.
      tags: [Controller · System]
      security: [{ControllerSession: []}]
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/get/setting/{key}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - name: key
        in: path
        required: true
        description: Setting group
        schema:
          type: string
          examples: [mgmt, ips, rsyslogd, ntp, snmp, connectivity, ssl_inspection]
    get:
      operationId: getSiteSetting
      summary: One site setting group
      description: Same record shape as one entry of `listSiteSettings`; same secrets warning applies.
      tags: [Controller · System]
      security: [{ControllerSession: []}]
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/described-features:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listSiteFeatures
      summary: Feature flags supported on this site and console
      description: |
        Names such as `ZONE_BASED_FIREWALL`, `WAN_SLA`, `ALARM_MANAGER`, `SWITCH_CUSTOM_ACL_RULES`, `WIREGUARD_VPN_SERVER`
        (113 on 11.0.81). Check before calling an endpoint whose feature may be absent.
      tags: [Controller · System]
      security: [{ControllerSession: []}]
      parameters:
        - {name: includeSystemFeatures, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string, examples: [ZONE_BASED_FIREWALL]}
                    feature_exists: {type: boolean}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/global/config/network:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: getGlobalNetworkConfig
      summary: Site-wide network settings (IGMP snooping, mDNS, multicast, default security posture)
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_security_posture: {type: string}
                  igmp_snooping_for: {type: string}
                  igmp_snooping_for_network_ids: {type: array, items: {type: string}}
                  igmp_fastleave_for_network_ids: {type: array, items: {type: string}}
                  igmp_querier_switches: {type: array, items: {type: object, additionalProperties: true}}
                  flood_unknown_multicast_for_network_ids: {type: array, items: {type: string}}
                  mdns_enabled_for: {type: string}
                  mdns_enabled_for_network_ids: {type: array, items: {type: string}}
                  ipv6_pd_interfaces: {type: array, items: {type: object, properties: {wan_id: {type: string}, wan_networkgroup: {type: string}}}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/lan/enriched-configuration:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listLanConfigurationWithStats
      summary: Networks (LANs) with live client counts and satisfaction
      description: '`configuration` is the `networkconf` record; `statistics` adds current/peak clients and satisfaction.'
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnrichedConfiguration'}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/wlan/enriched-configuration:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listWlanConfigurationWithStats
      summary: SSIDs with live client counts and satisfaction
      description: '`configuration` is the `wlanconf` record (includes the passphrase); `statistics` adds clients, APs and satisfaction.'
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnrichedConfiguration'}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/wan/enriched-configuration:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listWanConfigurationWithStats
      summary: WAN connections with uptime percentage, peak usage and ISP details
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EnrichedConfiguration'}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/wlanconf:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listWlanConfigLegacy
      summary: SSID configuration (controller format)
      description: |
        Every SSID setting the UI exposes, including some the Integration API does not (for example `ap_group_ids`,
        minimum data rates, roaming assistant). **Sensitive:** includes `x_passphrase` and `x_iapp_key` in plain text.
        Prefer `listWifiBroadcasts` unless a field is only here.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createWlanConfig
      summary: Create an SSID (controller format)
      description: |
        Captured 2026-10-18 (UI create of a throwaway SSID, then delete): a whole object of 53 keys without `_id`; the reply is
        the legacy envelope with `_id`, `site_id`, `short_id` and `external_id` added. `x_passphrase` is a write-only secret.
        Not callable through the generic tool: use `unifi_console_wifi`.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/rest/wlanconf/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: id, in: path, required: true, description: SSID `_id`, schema: {type: string}}
    put:
      operationId: updateWlanConfig
      summary: Update an SSID (whole object)
      description: |
        Captured 2026-10-18: the UI sends the whole object (62 keys) including `_id`. Secrets (`x_passphrase`, `x_iapp_key`)
        come back from the read and are sent again. Not callable through the generic tool: use `unifi_console_wifi`.
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    delete:
      operationId: deleteWlanConfig
      summary: Delete an SSID
      description: "Captured 2026-10-18: no body; reply `{meta:{rc:ok}, data:[]}`. Not callable through the generic tool: use `unifi_console_wifi`."
      tags: [Controller · Networks]
      security: [{ControllerSession: []}]
      x-destructive: true
      responses:
        '200': {description: Deleted}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/apgroups:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
