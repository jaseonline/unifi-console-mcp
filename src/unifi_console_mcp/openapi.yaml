  /proxy/network/v2/api/site/{site}/firewall-app-blocks:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listFirewallAppBlocks
      summary: Application block entries (Simple App Blocking)
      description: |
        Captured 2026-10-18. A JSON array; each entry: `_id`, `name`, `type` (`DEVICE` or `NETWORK`), `target_type`
        (`APP_ID` or `APP_CATEGORY`), `app_ids`, `app_category_ids`, `client_macs`, `network_ids` (all lists, the ones
        that do not apply are `[]`) and `schedule` (`mode` ALWAYS, EVERY_DAY, EVERY_WEEK, ONE_TIME_ONLY or CUSTOM). The
        console generates a `simple_app_block` firewall policy for each entry (`origin_id` is the entry's `_id`).
      tags: [Controller · Firewall]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK (array)
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: replaceFirewallAppBlocks
      summary: Replace the whole set of application blocks
      description: |
        Captured 2026-10-18 (Network 11.0.81). The body is the **complete array** of blocks and replaces the collection:
        an entry sent without `_id` is created, an entry with its `_id` is updated, an entry left out is deleted, and `[]`
        deletes them all. The UI edits the table locally and sends everything in one request when Apply is pressed. The
        response is the new collection with `_id`s. Not callable through the generic tool: use `unifi_console_app_block`.
      x-destructive: true
      tags: [Controller · Firewall]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {type: object, additionalProperties: true}
      responses:
        '200': {description: OK (the new array)}
        '400': {description: Validation failed}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

