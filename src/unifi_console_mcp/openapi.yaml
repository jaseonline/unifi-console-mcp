  /proxy/network/api/s/{site}/rest/device/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - name: id
        in: path
        required: true
        description: Device ID as used by the UI (a UUID on 11.0.81).
        schema: {type: string, examples: [6b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e]}
    put:
      operationId: updateDeviceSettings
      summary: Update a device's settings or switch ports (name, LED, IP, SNMP, STP, port_overrides)
      description: |
        What the UI saves from a device's *Settings* panel and from switch port edits. Covers what the Integration
        API cannot change: name, LED, management network and IP, SNMP contact/location; on switches jumbo frames,
        flow control, STP version/priority, 802.1X and every port's settings; on gateways NAT mode, hardware offload
        and firewall state timeouts. The UI sends either the settings panel or `port_overrides`, not both.
        **Partial bodies are accepted** (confirmed 2026-10-18 on an access point): `{"name": ..., "mgmt_network_id": ...}`
        changes just those fields, and `{"disabled": true|false}` disables or enables the device. The one exception is
        `port_overrides`, which replaces the whole array (see below). `unifi_console_device` sends changed fields only.

        **Switch ports (`port_overrides`):** the array **replaces** the device's saved port settings. There is no
        separate read call: the UI builds it from the `port_overrides` it already holds from `getDeviceDetail` /
        `listDevicesDetailed`. Read that, change the entries for the target ports, and send every entry back (the UI
        puts the edited ports first; order does not matter). An entry left out presumably loses its overrides and
        returns to defaults. Several ports can be changed in one call.
        - Disable a port: `forward: disabled` (the UI also clears `native_networkconf_id` and sets
          `tagged_vlan_mgmt: block_all`).
        - Re-enable: `forward: all` (or `customize`) with a `native_networkconf_id`. **Pick the network the device
          belongs on:** re-enabling in the UI defaults to the first network, which can move a device off its VLAN.

        **Gateways:** saving the panel, even just a rename, also sends `firewall_state_timeouts`, `nat_mode` and
        `hardware_offload`, and the UI follows it with `updateSiteSetting` for `usg` and `global_nat` and a POST to
        `settings/ipsec`. Treat any gateway save as a firewall change.

        **High impact (written plan and approval first, backup taken):** `config_network` (a wrong IP, mask or
        gateway strands the device until it is re-adopted or reset), `stp_priority` / `stp_version` and the port
        `stp_*` fields (re-elect the STP root and can block ports), any `native_networkconf_id` or `forward` change
        (VLAN membership), and anything on the gateway.

        **Lowest-risk tests:** `deviceManagerCommand` `set-locate` (no configuration change), then renaming a switch
        or AP, or its `led_override` (`on` / `off` / `default`).
      x-destructive: true
      tags: [Controller · Devices]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceSettingsWrite'}
            examples:
              ledOff:
                summary: Turn the LED off (full body as the UI sends it)
                value:
                  name: Switch 8 PoE-60W
                  config_network: {type: static, ip: 192.168.1.4, netmask: 255.255.255.0, gateway: 192.168.1.1, dns1: 192.168.1.1, dns2: '', dnssuffix: '', bonding_enabled: false}
                  mgmt_network_id: 5d2c9a7e-1f3b-4c6d-8e2a-7b9f0c1d3e4a
                  led_override: 'off'
                  led_override_color: '#0000ff'
                  led_override_color_brightness: 100
                  snmp_contact: admin@example.com
                  snmp_location: Comms cupboard
                  jumboframe_enabled: true
                  flowctrl_enabled: true
                  stp_version: stp
                  stp_priority: '8192'
                  dot1x_portctrl_enabled: false
                  ether_lighting: {}
              disablePort:
                summary: Disable port 3 (the other overridden ports are sent unchanged; shortened to two here)
                value:
                  port_overrides:
                    - {port_idx: 3, setting_preference: manual, name: TV, forward: disabled, native_networkconf_id: '', tagged_vlan_mgmt: block_all, excluded_networkconf_ids: [], port_security_enabled: false, port_security_mac_address: [], autoneg: true, isolation: false, flow_control_enabled: false, lldpmed_enabled: false, voice_networkconf_id: '', dot1x_ctrl: force_authorized, dot1x_idle_timeout: 300, multicast_router_mode: NONE, multicast_router_networkconf_ids: [], stormctrl_type: rate, stormctrl_bcast_enabled: true, stormctrl_bcast_rate: 100, stormctrl_mcast_enabled: true, stormctrl_mcast_rate: 200, stormctrl_ucast_enabled: true, stormctrl_ucast_rate: 100, egress_rate_limit_kbps_enabled: false, link_debounce_auto: true, port_keepalive_enabled: true, stp_port_mode: true, stp_uplink: false, stp_edge_state: disabled, stp_bpdu_guard_enabled: false}
                    - {port_idx: 1, setting_preference: manual, name: Uplink, forward: all, native_networkconf_id: 5d2c9a7e-1f3b-4c6d-8e2a-7b9f0c1d3e4a, tagged_vlan_mgmt: auto, port_security_enabled: false, port_security_mac_address: [], autoneg: true, isolation: false, flow_control_enabled: false, lldpmed_enabled: false, voice_networkconf_id: '', multicast_router_mode: NONE, stormctrl_type: rate, stormctrl_bcast_enabled: true, stormctrl_bcast_rate: 300, stormctrl_mcast_enabled: true, stormctrl_mcast_rate: 500, stormctrl_ucast_enabled: true, stormctrl_ucast_rate: 1000, egress_rate_limit_kbps_enabled: false, port_keepalive_enabled: true, stp_port_mode: true, stp_edge_state: auto, stp_bpdu_guard_enabled: false}
              renameGateway:
                summary: Gateway panel save (rename); followed by updateSiteSetting usg and global_nat
                value:
                  name: Gateway TEST
                  led_override: 'off'
                  led_override_color: '#0000ff'
                  led_override_color_brightness: 100
                  hardware_offload: true
                  snmp_location: Comms cupboard
                  snmp_contact: admin@example.com
                  jumboframe_enabled: true
                  flowctrl_enabled: false
                  firewall_state_timeouts: {timeout_setting_preference: auto, tcp_established_timeout: 7440, tcp_close_timeout: 10, tcp_close_wait_timeout: 60, tcp_fin_wait_timeout: 120, tcp_last_ack_timeout: 30, tcp_syn_recv_timeout: 60, tcp_syn_sent_timeout: 120, tcp_time_wait_timeout: 120, udp_stream_timeout: 180, udp_other_timeout: 30, icmp_timeout: 30, other_timeout: 600, unbind_wan_monitors: false, dns_verification: {setting_preference: auto, domain: ui.com, primary_dns_server: 1.1.1.1, secondary_dns_server: 8.8.8.8}}
                  firewall_connection_tracking_modules: []
                  nat_mode: auto
                  nat_excluded_network_ids: []
                  ikev2_seamless_rekeying: false
      responses:
        '200':
          description: OK. `data[0]` is the whole updated device record (including `port_overrides`).
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/LegacyEnvelope'}
                  - properties: {data: {type: array, items: {$ref: '#/components/schemas/LegacyDevice'}}}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/stats/recent/series:
    get:
      operationId: getStatsSeries
      summary: Device time-series statistics (per-port traffic, errors and PoE; CPU and memory)
      description: |
        The data behind the UI's history charts. `schema` picks the series; `portBySiteByDevice` with
        `projection=nested(byPort)` returns, for one switch, every port's traffic, broadcast/multicast, error and drop
        counts and PoE draw per bucket. Each bucket holds totals for its `duration` (fractional because values are
        normalised to the bucket); the last bucket is partial. `systemBySiteByDevice` with
        `projection=values(avgCpuUtilizationPct, avgMemoryUtilizationPct)` returns CPU and memory for any device.

        Use it to find a flapping, erroring or saturated port, or a PoE device near its budget, and to see when it
        started. `filter` uses the same syntax as the Integration API.
      tags: [Controller · Devices]
      security: [{ControllerSession: []}]
      parameters:
        - name: schema
          in: query
          required: true
          description: Series to return. Captured so far are `portBySiteByDevice` (switch ports) and `systemBySiteByDevice` (CPU, memory).
          schema: {type: string, examples: [portBySiteByDevice, systemBySiteByDevice]}
        - name: period
          in: query
          required: true
          description: Window length ending at `end`.
          schema: {type: string, examples: [DAY]}
        - name: end
          in: query
          required: true
          description: Window end, Unix epoch milliseconds.
          schema: {type: integer, examples: [1792214788931]}
        - name: bucket
          in: query
          description: Omitted by the UI for `systemBySiteByDevice`.
          schema: {type: string, examples: [OF_5_MINUTES]}
        - name: filter
          in: query
          required: true
          description: 'Which device: `deviceMac`, `siteId` (the site UUID, `site_id` on device records), and `unitId.isNull()` (or a unit for switch stacks).'
          schema: {type: string}
          examples:
            oneSwitch:
              summary: One switch, not stacked
              value: "and(deviceMac.eq('00:00:5e:00:53:04'), unitId.isNull(), siteId.eq('6b1d2c3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e'))"
        - name: projection
          in: query
          description: '`nested(byPort)` groups values per port inside each bucket; `values(a, b)` picks fields.'
          schema: {type: string, examples: ['nested(byPort)', 'values(avgCpuUtilizationPct, avgMemoryUtilizationPct)']}
        - name: noGaps
          in: query
          description: Fill missing buckets so the series is continuous.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: One entry per matching device
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StatsSeries'}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/stat/device/{mac}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - name: mac
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MacAddress'}
    get:
      operationId: getDeviceDetail
      summary: Full detail for one device (ports, STP, PoE, radios, uplink, LLDP, CPU and memory)
      description: |
        The same record as one entry of `listDevicesDetailed`, for a single device. Read this before
        `updateDeviceSettings`: its `port_overrides` array is what a port change must be built from.

        Useful fields: `port_table[]` (live state per port: `stp_state`, `stp_role`, `stp_state_change_count`,
        `link_down_count`, error and drop counters, `satisfaction`, PoE), `uplink`, `lldp_table`, `system-stats`
        (CPU, memory, uptime), `radio_table_stats` (APs: channel, utilisation, retries), `locating`, `led_override`.

        **Sensitive:** fields prefixed `x_` (for example `x_authkey`, `x_aes_gcm`, `x_vwirekey`) are device keys.
        Never log or store the raw response.
      tags: [Controller · Devices]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK (one entry)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/LegacyEnvelope'}
                  - properties: {data: {type: array, items: {$ref: '#/components/schemas/LegacyDevice'}}}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/cmd/devmgr:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: deviceManagerCommand
      summary: Device command (locate, restart)
      description: |
        Captured commands:
        - `set-locate` / `unset-locate`: flash the device LED so it can be found. Changes no configuration, so this
          is the **lowest-risk test of write access**.
        - `restart`: reboot the device. `reboot_type: hard` also power-cycles the PoE ports, so every device powered
          by a switch goes down with it. Restarting a switch or the gateway takes down everything behind it.

        The UI's *Debug* terminal also uses this endpoint (`build-ssh-session`, then `ssh-sdp-answer`) after
        `cmd/cloudaccess` `get-turn-credentials` returns short-lived TURN relay credentials. That is a WebRTC
        session through UniFi's relay, so it is not usable from an API client; use SSH instead.
      x-destructive: true
      tags: [Controller · Devices]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd, mac]
              properties:
                cmd: {type: string, enum: [set-locate, unset-locate, restart, adopt]}
                mac: {$ref: '#/components/schemas/MacAddress'}
                reboot_type: {type: string, enum: [soft, hard], description: '`restart` only. The UI sends `hard` (which also power-cycles PoE ports); there is no soft reset on this console.'}
                client: {type: string, enum: [web], description: '`adopt` only: the UI sends `"client": "web"`.'}
            examples:
              locate: {summary: 'Start flashing the LED', value: {cmd: set-locate, mac: '00:00:5e:00:53:04'}}
              stopLocate: {summary: 'Stop flashing', value: {cmd: unset-locate, mac: '00:00:5e:00:53:04'}}
              restartHard: {summary: 'Restart and power-cycle PoE ports', value: {cmd: restart, mac: '00:00:5e:00:53:04', reboot_type: hard}}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/cmd/sitemgr:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: siteManagerCommand
      summary: Site command (remove devices)
      description: |
        Captured 2026-10-18 (`device-remove.har`): `{"macs": [mac, ...], "cmd": "delete-device"}` removes ("forgets") the
        devices from the site. The reply is the device record. The device must be adopted again to rejoin, and the
        device's `_id` changes when it is. **Irreversible short of re-adopting**; use `unifi_console_device`.
      x-destructive: true
      tags: [Controller · Devices]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cmd, macs]
              properties:
                cmd: {type: string, enum: [delete-device]}
                macs: {type: array, items: {$ref: '#/components/schemas/MacAddress'}}
            examples:
              remove: {summary: Remove one device, value: {cmd: delete-device, macs: ['00:00:5e:00:53:04']}}
      responses:
        '200': {$ref: '#/components/responses/LegacyOk'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/set/setting/{key}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - name: key
        in: path
        required: true
        description: Setting group, as in `getSiteSetting`
        schema: {type: string, examples: [lcm, usg, global_nat]}
    post:
      operationId: updateSiteSetting
      summary: Update one site setting group
      description: |
        Writes a group read by `getSiteSetting`. The body includes `key` (same as the path). Captured groups:
        - `lcm`: the display (LCM touchscreen) on devices that have one: `enabled`, `brightness`, `idle_timeout`
          (seconds), `touch_event`, `sync`. Not the status LED, which is per device (`led_override` on
          `updateDeviceSettings`).
        - `usg`: gateway-wide options: MSS clamping, ARP cache, connection-tracking helper modules (FTP, SIP, GRE,
          PPTP, TFTP, H.323), firewall state timeouts.
        - `global_nat`: NAT `mode` and `excluded_network_ids`.

        The UI sends `usg` and `global_nat` automatically after any gateway *Settings* save, even a rename.
        `usg` and `global_nat` change how the gateway forwards traffic: treat as firewall changes (written plan first).
        Partial bodies have not been tested; send the whole group read from `getSiteSetting`.
      x-destructive: true
      tags: [Controller · System]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [key], additionalProperties: true, properties: {key: {type: string}}}
            examples:
              lcm:
                summary: Device display settings
                value: {key: lcm, enabled: true, brightness: 100, touch_event: true, idle_timeout: 300, sync: true}
              usg:
                summary: Gateway options as the UI sends them
                value: {key: usg, mss_clamp: auto, mss_clamp_mss: '1452', arp_cache_timeout: normal, arp_cache_base_reachable: 30, echo_server: ping.ui.com, dns_verification: {setting_preference: auto}, timeout_setting_preference: auto, ftp_module: false, h323_module: false, sip_module: false, gre_module: false, pptp_module: false, tftp_module: false}
              globalNat:
                summary: Automatic NAT
                value: {key: global_nat, mode: auto, excluded_network_ids: []}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/api/s/{site}/set/setting/doh:
    parameters: [{$ref: '#/components/parameters/Site'}]
    post:
      operationId: updateDohSetting
      summary: Update the DNS over HTTPS (DoH) setting group
      description: |
        Captured in the DoH HAR (2026-10-17). Body is the whole group as the UI sends it:
        `{key: doh, state, server_names[], custom_servers[]}`. `state` is `off`, `manual` (named resolvers from
        `getDohAvailableServerNames`) or `custom` (entries `{server_name, sdns_stamp, enabled}`). The UI clears the other
        list when switching mode. The reply is the legacy envelope with the whole group.

        **Changing this can stop DNS for the whole network** (gateway resolver unreachable or the name list wrong), which
        may also cut the connection this tool runs over. Use the typed tool `unifi_console_doh`, which probes DNS before
        and after and puts the old values back automatically if the probe fails.
      x-destructive: true
      tags: [Controller · System]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, state]
              additionalProperties: false
              properties:
                key: {type: string, enum: [doh]}
                state: {type: string, enum: [off, manual, custom]}
                server_names: {type: array, items: {type: string}}
                custom_servers:
                  type: array
                  items:
                    type: object
                    properties:
                      server_name: {type: string}
                      sdns_stamp: {type: string}
                      enabled: {type: boolean}
            examples:
              manual:
                summary: Cloudflare with its IPv6 partner
                value: {key: doh, state: manual, server_names: [cloudflare, cloudflare-ipv6], custom_servers: []}
              off:
                summary: DoH off
                value: {key: doh, state: 'off', server_names: [], custom_servers: []}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/settings/usg/defaults:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
