        - {name: endTimestamp, in: query, schema: {type: string, format: date-time}}
        - name: duration
          in: query
          description: '`24h` for `5m` data; `7d` or `30d` for `1h` data.'
          schema: {type: string, enum: [24h, 7d, 30d]}
