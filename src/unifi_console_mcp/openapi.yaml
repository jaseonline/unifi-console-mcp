          description: IP subnet in CIDR notation to match.
          type: string
    # ================================================================ Controller API
    PortForwardBody:
      type: object
      description: Port forward record (legacy `rest/portforward`). On create all 11 keys below are sent; on update only the changed keys.
      properties:
        enabled: {type: boolean}
        name: {type: string}
        pfwd_interface: {type: string, description: "`wan` (only value verified on this console; `wan2` and `both` exist in the UI)"}
        destination_ip: {type: string, description: "`any` is the only value used so far"}
        destination_ips: {type: array, items: {type: string}}
        dst_port: {type: string, description: "External port or range, e.g. `58699` or `58690-58699`"}
        fwd: {type: string, description: Internal IPv4 address}
        fwd_port: {type: string, description: Internal port or range}
        proto: {type: string, enum: [tcp, udp, tcp_udp]}
        src_limiting_enabled: {type: boolean}
        log: {type: boolean}
    LegacyEnvelope:
      type: object
      description: Every `/api/s/{site}` response uses this wrapper. Check `meta.rc` - errors can arrive with HTTP 200.
      properties:
        meta:
          type: object
          properties:
            rc: {type: string, enum: [ok, error]}
            msg: {type: string, description: 'Error key when `rc` is `error`, for example `api.err.LoginRequired`, `api.err.NoSiteContext`, `api.err.InvalidObject`'}
        data:
          type: array
          items: {type: object, additionalProperties: true}
    LegacyHealth:
      type: object
      additionalProperties: true
      properties:
        subsystem: {type: string, enum: [wan, www, lan, wlan, vpn]}
        status: {type: string, enum: [ok, warning, error, unknown]}
        num_adopted: {type: integer}
        num_disconnected: {type: integer}
        num_pending: {type: integer}
        num_user: {type: integer, description: 'Clients on this subsystem'}
        num_guest: {type: integer}
        num_iot: {type: integer}
        wan_ip: {type: string, examples: [203.0.113.10]}
        isp_name: {type: string}
        latency: {type: integer, description: 'ms (www subsystem)'}
        uptime: {type: integer, description: 'seconds'}
        xput_down: {type: number, description: 'Last speed test, Mbps'}
        xput_up: {type: number, description: 'Last speed test, Mbps'}
    LegacySysInfo:
      type: object
      additionalProperties: true
      properties:
        version: {type: string, description: 'Network Application version', examples: ['9.4.19']}
        build: {type: string}
        hostname: {type: string}
        name: {type: string}
        timezone: {type: string, examples: [Europe/London]}
        uptime: {type: integer}
        update_available: {type: boolean}
        ip_addrs: {type: array, items: {type: string}}
    LegacyEvent:
      type: object
      additionalProperties: true
      properties:
        _id: {type: string}
        key: {type: string, examples: [EVT_SW_Lost_Contact, EVT_WU_Connected]}
        msg: {type: string}
        subsystem: {type: string, examples: [lan, wlan]}
        time: {type: integer, description: 'Unix epoch milliseconds'}
        datetime: {type: string, format: date-time}
        archived: {type: boolean, description: 'Alarms only'}
    LegacyDeviceBasic:
      type: object
      additionalProperties: true
      properties:
        mac: {$ref: '#/components/schemas/MacAddress'}
        state: {type: integer, description: '0 disconnected, 1 connected, 2 pending, 4 upgrading, 5 provisioning, 6 heartbeat missed, 7 adopting, 11 isolated'}
        adopted: {type: boolean}
        disabled: {type: boolean}
        type: {type: string, enum: [uap, usw, ugw, udm, uxg]}
        model: {type: string}
        name: {type: string}
    LegacyDevice:
      allOf:
        - {$ref: '#/components/schemas/LegacyDeviceBasic'}
        - type: object
          properties:
            _id: {type: string}
            ip: {type: string}
            version: {type: string}
            upgradable: {type: boolean}
            uptime: {type: integer}
            port_table:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  port_idx: {type: integer}
                  name: {type: string}
                  up: {type: boolean}
                  speed: {type: integer}
                  poe_enable: {type: boolean}
                  poe_power: {type: string, description: 'Watts'}
                  port_poe: {type: boolean, description: 'Port can supply PoE'}
                  enable: {type: boolean}
                  forward: {type: string, enum: [all, customize, disabled]}
                  native_networkconf_id: {type: string}
                  is_uplink: {type: boolean}
                  media: {type: string, examples: [GE, SFP+]}
                  full_duplex: {type: boolean}
                  stp_state: {type: string, examples: [forwarding, blocking, disabled]}
                  stp_role: {type: string}
                  stp_pathcost: {type: integer}
                  stp_state_change_count: {type: integer, description: 'A rising count means the port keeps re-converging'}
                  link_down_count: {type: integer, description: 'A rising count means a flapping link'}
                  rx_errors: {type: integer}
                  tx_errors: {type: integer}
                  rx_dropped: {type: integer}
                  tx_dropped: {type: integer}
                  satisfaction: {type: integer, description: '0-100'}
                  satisfaction_reason: {type: string}
                  mac_table_count: {type: integer, description: 'MACs learnt on the port'}
                  anomalies: {type: integer}
            port_overrides: {type: array, items: {$ref: '#/components/schemas/PortOverride'}, description: 'Saved port settings; the basis for a port change'}
            led_override: {type: string, enum: ['on', 'off', default]}
            locating: {type: boolean}
            stp_version: {type: string}
            stp_priority: {type: string}
            system-stats:
              type: object
              properties:
                cpu: {type: string, description: 'Percent'}
                mem: {type: string, description: 'Percent'}
                uptime: {type: string, description: 'Seconds'}
            uplink: {type: object, additionalProperties: true, description: 'Upstream device, port, speed and counters'}
            lldp_table:
              type: array
              items:
                type: object
                properties:
                  local_port_idx: {type: integer}
                  local_port_name: {type: string}
                  chassis_id: {type: string}
                  port_id: {type: string}
                  is_wired: {type: boolean}
            radio_table_stats: {type: array, items: {type: object, additionalProperties: true}, description: 'APs: per-radio channel, utilisation (`cu_total`), retries, client count'}
            radio_table: {type: array, items: {type: object, additionalProperties: true}}
            vap_table: {type: array, items: {type: object, additionalProperties: true}}
    LegacyNetworkConf:
      type: object
      additionalProperties: true
      properties:
        _id: {type: string}
        name: {type: string, examples: [LAN_IoT]}
        purpose: {type: string, enum: [corporate, guest, wan, vlan-only, remote-user-vpn, site-vpn]}
        vlan: {type: integer}
        vlan_enabled: {type: boolean}
        ip_subnet: {type: string, examples: [10.88.1.1/24]}
        dhcpd_enabled: {type: boolean}
        dhcpd_start: {type: string, examples: [10.88.1.101]}
        dhcpd_stop: {type: string, examples: [10.88.1.254]}
        dhcpd_leasetime: {type: integer}
        igmp_snooping: {type: boolean}
        mdns_enabled: {type: boolean}
        firewall_zone_id: {type: string}
        networkgroup: {type: string, examples: [LAN]}
    FirewallGroup:
      type: object
      required: [name, group_type, group_members]
      properties:
        _id: {type: string, readOnly: true}
        site_id: {type: string, readOnly: true}
        name: {type: string}
        description: {type: string}
        source: {type: string, description: "`static` for lists created in the UI"}
        group_type: {type: string, enum: [address-group, ipv6-address-group, port-group, domain-group]}
        group_members:
          type: array
          description: Addresses/CIDRs/ranges, ports and port ranges as strings, or domain names. Replaced whole on update.
          items: {type: string}
    FirewallZone:
      type: object
      properties:
        _id: {type: string}
        name: {type: string, examples: [Internal, External, Gateway, Vpn, Hotspot, Dmz, IoT, Sonos]}
        zone_key: {type: string, examples: [internal]}
        default_zone: {type: boolean}
        attr_no_edit: {type: boolean, description: 'System zone; cannot be edited'}
        network_ids: {type: array, items: {type: string}}
    StaticDnsRecord:
      type: object
      additionalProperties: true
      properties:
        _id: {type: string, readOnly: true}
        enabled: {type: boolean}
        record_type: {type: string, enum: [A, AAAA, CNAME, MX, SRV, TXT]}
        key: {type: string, description: Record name, examples: [nas.example.home]}
        value: {type: string, description: 'Target: address, name or text'}
        ttl: {type: integer, description: 'Seconds; 0 = console default'}
        port: {type: integer, description: SRV only}
        priority: {type: integer, description: MX and SRV}
        weight: {type: integer, description: SRV only}
    KnownClientWrite:
      type: object
      description: Subset of the known-client record used for fixed-IP and naming changes.
      additionalProperties: true
      properties:
        mac: {$ref: '#/components/schemas/MacAddress'}
        name: {type: string}
        display_name: {type: string, description: 'The UI sends the same value as `name`'}
        note: {type: string}
        noted: {type: boolean, description: 'Set true when `note` is present'}
        use_fixedip: {type: boolean}
        fixed_ip: {type: string, format: ipv4, description: 'Must be in .1-.100 (static block) of the network''s subnet'}
        network_id: {type: string, description: '`_id` from `listNetworkConfig`'}
        local_dns_record_enabled: {type: boolean, description: 'Publish a local DNS record for this client'}
        local_dns_record: {type: string, description: 'Hostname for the local DNS record; empty when disabled'}
        virtual_network_override_enabled: {type: boolean, description: 'Place the client on a different network (VLAN) from its SSID or port'}
        virtual_network_override_id: {type: string, description: '`_id` of the override network; empty when disabled'}
        network_members_group_ids: {type: array, items: {type: string}, description: 'Client groups (used by policies) this client belongs to'}
        usergroup_id: {type: string, description: 'Bandwidth profile (user group) `_id`; empty for the default'}
        fixed_ap_enabled: {type: boolean, description: 'Lock a wireless client to one access point'}
        blocked: {type: boolean}
    KnownClient:
      allOf:
        - {$ref: '#/components/schemas/KnownClientWrite'}
        - properties:
            _id: {type: string, readOnly: true}
            oui: {type: string, readOnly: true}
            first_seen: {type: integer, readOnly: true}
            last_seen: {type: integer, readOnly: true}
    ActiveClient:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        mac: {$ref: '#/components/schemas/MacAddress'}
        name: {type: string}
        display_name: {type: string}
        hostname: {type: string}
        ip: {type: string}
        fixed_ip: {type: string}
        use_fixedip: {type: boolean}
        is_wired: {type: boolean}
        network_id: {type: string}
        network_name: {type: string}
        vlan: {type: integer}
        oui: {type: string, description: 'Manufacturer from the MAC prefix'}
        status: {type: string, examples: [online, offline]}
        last_uplink_mac: {type: string}
        last_uplink_name: {type: string}
        signal: {type: integer, description: 'dBm (wireless only)', examples: [-58]}
        satisfaction: {type: integer, minimum: 0, maximum: 100}
        uptime: {type: integer, description: 'seconds'}
        tx_bytes: {type: integer}
        rx_bytes: {type: integer}
    UserCertificate:
      type: object
      description: A TLS certificate installed on the console (metadata only).
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: 'Display name; the common name by default'}
        version: {type: integer, description: 'X.509 version', examples: [3]}
        serial_number: {type: string, description: 'Upper-case hex'}
        fingerprint: {type: string, description: 'SHA-1 fingerprint, colon-separated hex'}
        subject: {type: object, description: 'Subject distinguished-name fields (`CN`, `O`, ...), additionalProperties: {type: string}'}
        issuer: {type: object, description: 'Issuer distinguished-name fields (`C`, `O`, `CN`), additionalProperties: {type: string}'}
        subject_alt_name:
          type: object
          properties:
            DNS: {type: array, items: {type: string}}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time, description: 'Expiry. Let''s Encrypt certificates last 90 days and are renewed automatically.'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        source: {type: string, description: 'How it was installed', examples: [lets_encrypt]}
        acme_renew_error: {type: [string, object, 'null'], description: 'Last automatic renewal error; null when renewal is healthy'}
        active: {type: boolean, description: 'True for the certificate the console is currently serving'}
    ConsoleBackupComponent:
      type: object
      description: One application or service included in a console backup.
      properties:
        size: {type: integer, description: 'Bytes'}
        version: {type: string, examples: [11.0.81-37038-1]}
        success: {type: boolean, description: 'False if this component failed to back up'}
    ConsoleBackup:
      type: object
      description: A console (UniFi OS) backup stored on the console.
      properties:
        id: {type: string, format: uuid}
        time: {type: integer, description: 'Created at, Unix epoch milliseconds'}
        frequency: {type: string, description: 'Schedule that produced it', examples: [WEEKLY]}
        size: {type: integer, description: 'Archive size in bytes'}
        metadata:
          type: object
          properties:
            controllers:
              type: object
              description: Applications included, keyed by name (for example `network`).
              additionalProperties: {$ref: '#/components/schemas/ConsoleBackupComponent'}
            services:
              type: object
              description: Console services included, keyed by name (for example `users`).
              additionalProperties: {$ref: '#/components/schemas/ConsoleBackupComponent'}
            firmware_version: {type: string, description: 'UniFi OS version at backup time', examples: [6.0.11]}
            hardware_shortname: {type: string, examples: [UCKP]}
            id: {type: string, format: uuid, description: 'Same as the top-level `id`'}
            mac: {type: string, description: 'Console MAC, upper case without separators'}
            owner_id: {type: string, format: uuid, description: 'Console owner account'}
            timezone: {type: string, examples: [Europe/London]}
            created_at: {type: integer, description: 'Same as `time`'}
            frequency: {type: string, description: 'Same as the top-level `frequency`'}

    # ================================================================ Controller: traffic, alerts, firewall UI view
