              schema: {type: object, additionalProperties: true}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /proxy/network/v2/api/site/{site}/system-log/{logId}/cef:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - name: logId
        in: path
        required: true
        description: The `id` of a System Log entry (UUID or 24-hex).
        schema: {type: string}
    get:
      operationId: getSystemLogEntryCef
      summary: One System Log entry as a CEF syslog line
      description: |
        The entry rendered in ArcSight CEF, exactly as sent to a remote syslog server: every parameter appears as a
        `UNIFIname=value` extension plus a resolved `msg`. The UI also passes the same ID as `?id=`.
        Handy for a one-line, fully resolved summary of an event.
      tags: [Controller · Alerts]
      security: [{ControllerSession: []}]
      parameters:
        - name: id
          in: query
          description: Same value as `logId`.
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cef_log: {type: string}
              example:
                cef_log: 'CEF:0|Ubiquiti|UniFi Network|11.0.81|401|WiFi Client Disconnected|2|UNIFIcategory=Client Devices UNIFIsite=Example Site UNIFIhost=Cloud Key Gen2 Plus UNIFIlastConnectedToDeviceName=AP-Hall UNIFIlastConnectedToDeviceIp=192.168.1.6 UNIFIclientAlias=Tablet UNIFIclientIp=192.168.1.150 UNIFIclientMac=00:00:5e:00:53:2e UNIFIwifiChannel=100 UNIFIwifiName=example-ssid UNIFIwifiBand=na UNIFIlastConnectedToWiFiRssi=-61 UNIFIduration=9m 43s UNIFInetworkName=LAN UNIFInetworkVlan=1 UNIFIutcTime=2026-10-16T11:41:55.474Z msg=Tablet disconnected from example-ssid. Time Connected: 9m 43s. Last Connected To: AP-Hall at -61 dBm.'
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
