  # ---------------------------------------------------------------------------------------------
  # Added 2026-10-17 from live probes of Network 11.0.81 (scripts/probe_endpoints.py) plus the
  # endpoint list used by the upstream sirkirby/unifi-network-mcp client. Shapes marked "not yet
  # captured" came back empty on this site; the fields are the upstream client's, unverified here.
  # ---------------------------------------------------------------------------------------------
  /proxy/network/api/self/sites:
    get:
      operationId: getSelfSites
      summary: Sites the logged-in account can see (with device counts)
      description: |
        Not scoped to a site, so it works before you know the site name. Returns the site `name` (the
        short name used in paths, `default` here), the display `desc`, `role` and `device_count`.
      tags: ["Controller · System"]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LegacyEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            _id: {type: string}
                            name: {type: string, examples: [default]}
                            desc: {type: string}
                            role: {type: string}
                            role_hotspot: {type: boolean}
                            device_count: {type: integer}
                            external_id: {type: string}
                            anonymous_id: {type: string}
                            location_lat: {type: number}
                            location_lng: {type: number}
                            attr_no_delete: {type: boolean}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/api/s/{site}/rest/dynamicdns:
    parameters: [{$ref: '#/components/parameters/Site'}]
    get:
      operationId: listDynamicDns
      summary: Dynamic DNS entries
      description: |
        Provider, host name and login per WAN interface. `x_password` is always redacted.
      tags: ["Controller · Networks"]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LegacyEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                          properties:
                            _id: {type: string}
                            interface: {type: string, examples: [wan]}
                            service: {type: string}
                            server: {type: string}
                            host_name: {type: string}
                            login: {type: string}
                            x_password: {type: string, description: 'Always redacted'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    post:
      operationId: createDynamicDns
      summary: Create a Dynamic DNS entry
      description: |
        Legacy `rest/*` endpoint; the reply is the usual `{meta, data[]}` envelope. The UI sends exactly
        `{service, host_name, interface, login, x_password, server}` (captured 2026-10-17). An existing entry is edited with
        `PUT .../rest/dynamicdns/{id}` (`updateDynamicDns`, captured 2026-10-18). `x_password` is the provider token and is write-only.
        Not callable through the generic tool: use `unifi_console_dynamic_dns`, which takes the token from an environment
        variable of the server (never from chat), previews, journals without the token and reads back.
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service: {type: string, examples: [cloudflare]}
                host_name: {type: string}
                interface: {type: string, examples: [wan]}
                login: {type: string}
                x_password: {type: string, description: Write-only provider token}
                server: {type: string}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  /proxy/network/api/s/{site}/rest/dynamicdns/{id}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: id, in: path, required: true, description: 'Entry `_id` (from `listDynamicDns`)', schema: {type: string}}
    put:
      operationId: updateDynamicDns
      summary: Update a Dynamic DNS entry
      description: |
        Captured 2026-10-18 (the UI, rotating the Cloudflare key): `PUT .../rest/dynamicdns/{id}` with exactly
        `{service, host_name, interface, login, x_password, server}` (no `_id`, no `site_id`); the reply is the usual
        `{meta, data[]}` envelope with the entry and the same `_id`. The list never shows the stored token, so an update has to
        send the token again (the current one when it is not being changed). Not callable through the generic tool; use
        `unifi_console_dynamic_dns`.
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service: {type: string, examples: [cloudflare]}
                host_name: {type: string}
                interface: {type: string, examples: [wan]}
                login: {type: string}
                x_password: {type: string, description: Write-only provider token}
                server: {type: string}
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
    delete:
      operationId: deleteDynamicDns
      summary: Delete a Dynamic DNS entry
      description: |
        Discards the stored provider token: it cannot be read back, so a deleted entry can only be recreated with a fresh
        token. Not callable through the generic tool; use `unifi_console_dynamic_dns`.
      x-destructive: true
      tags: ["Controller · Networks"]
      security: [{ControllerSession: [], CsrfToken: []}]
      responses:
        '200': {$ref: '#/components/responses/LegacyList'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

