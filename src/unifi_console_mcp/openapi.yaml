        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /proxy/network/integration/v1/sites/{siteId}/firewall/policies:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listFirewallPolicies
      summary: List firewall policies
      description: Filterable on `id`, `name`, `source.zoneId`, `destination.zoneId`, `metadata.origin`.
      tags: [Integration · Firewall]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicyPage'}
          links:
            getPolicy:
              operationId: getFirewallPolicy
              parameters: {siteId: '$request.path.siteId', firewallPolicyId: '$response.body#/data/0/id'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createFirewallPolicy
      summary: Create a firewall policy
      description: Structural change. Needs a written plan and approval. New policies are placed at the end of the zone pair's user-defined order.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallPolicyWrite'}
            examples:
              blockIotToInternal:
                summary: Block IoT to Internal
                value:
                  name: Block IoT to Internal
                  enabled: true
                  action: {type: BLOCK}
                  source: {zoneId: 3a6b5f2b-7c1e-4d8a-9e6c-0a2d1b4f3e5a}
                  destination: {zoneId: 9f1b2d0a-4e3f-4a6b-8c1e-5f2b7c3d8a4e}
                  ipProtocolScope: {ipVersion: IPV4_AND_IPV6}
                  loggingEnabled: true
              allowIotToHaPort:
                summary: Allow IoT to reach one host on TCP 8123, new connections only
                value:
                  name: Allow IoT to Home Assistant
                  enabled: true
                  action: {type: ALLOW, allowReturnTraffic: true}
                  source: {zoneId: 3a6b5f2b-7c1e-4d8a-9e6c-0a2d1b4f3e5a}
                  destination:
                    zoneId: 9f1b2d0a-4e3f-4a6b-8c1e-5f2b7c3d8a4e
                    trafficFilter:
                      type: IP_ADDRESS
                      ipAddressFilter: {type: IP_ADDRESSES, matchOpposite: false, items: [{type: IP_ADDRESS, value: 192.168.1.20}]}
                      portFilter: {type: PORTS, matchOpposite: false, items: [{type: PORT_NUMBER, value: 8123}]}
                  ipProtocolScope:
                    ipVersion: IPV4
                    protocolFilter: {type: NAMED_PROTOCOL, matchOpposite: false, protocol: {name: tcp}}
                  connectionStateFilter: [NEW]
                  loggingEnabled: false
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /proxy/network/integration/v1/sites/{siteId}/firewall/policies/{firewallPolicyId}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/FirewallPolicyId'}
    get:
      operationId: getFirewallPolicy
      summary: Get a firewall policy
      tags: [Integration · Firewall]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateFirewallPolicy
      summary: Replace a firewall policy
      description: Structural change. Show a before/after diff and obtain approval first.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallPolicyWrite'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: patchFirewallPolicy
      summary: Patch logging and flow reporting on a firewall policy
      description: Only `loggingEnabled` and `reportFlowEnabled` can be patched. To enable or disable a policy use `updateFirewallPolicy`.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                loggingEnabled: {type: boolean, description: 'Send matched traffic to remote syslog'}
                reportFlowEnabled: {type: boolean, description: 'Show matched traffic in Insights Flows'}
            examples:
              logOn: {summary: 'Turn on syslog logging', value: {loggingEnabled: true}}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteFirewallPolicy
      summary: Delete a firewall policy
      x-destructive: true
      tags: [Integration · Firewall]
      responses:
        '200': {description: 'Deleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/sites/{siteId}/firewall/policies/ordering:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: sourceFirewallZoneId, in: query, required: true, description: 'Source zone of the pair', schema: {type: string, format: uuid}}
      - {name: destinationFirewallZoneId, in: query, required: true, description: 'Destination zone of the pair', schema: {type: string, format: uuid}}
