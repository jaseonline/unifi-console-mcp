        - {name: outputSize, in: query, description: 'Maximum values returned per list', schema: {type: integer, examples: [1000]}}
        - {name: skipElements, in: query, schema: {type: integer, default: 0}}
      responses:
        '200':
          description: OK
          content:
            application/json:
